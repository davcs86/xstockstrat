name: Deploy prod

on:
  push:
    branches:
      - main

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - id: sha
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  buf-push:
    name: Publish proto definitions to BSR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.72.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: bufbuild/buf-push-action@v1
        with:
          input: packages/proto
          buf_token: ${{ secrets.BUF_TOKEN }}

  build-images:
    name: Build and push Docker images
    needs: [prepare]
    uses: ./.github/workflows/docker-build.yml
    with:
      image_tag: ${{ needs.prepare.outputs.short_sha }}
      latest_tag: latest
      ui_theme: production
      build_migrator: ${{ vars.HOMELAB_PRODUCTION_ENABLED == 'true' }}

  deploy:
    name: Deploy to prod
    needs: [prepare, build-images]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: production
      app_spec: .do/app.yaml
      image_tag: ${{ needs.prepare.outputs.short_sha }}

  deploy-homelab:
    name: Deploy to homelab production
    needs: [prepare, build-images]
    if: vars.HOMELAB_PRODUCTION_ENABLED == 'true'
    uses: ./.github/workflows/deploy-homelab.yml
    secrets: inherit
    with:
      environment: production
      image_tag: ${{ needs.prepare.outputs.short_sha }}
