name: Deploy dev

on:
  push:
    branches:
      - main-dev

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - id: sha
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  buf-push-dev:
    name: Publish proto definitions to BSR (dev draft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.72.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: bufbuild/buf-push-action@v1
        with:
          input: packages/proto
          buf_token: ${{ secrets.BUF_TOKEN }}
          draft: true

  build-images:
    name: Build and push Docker images
    needs: [prepare]
    uses: ./.github/workflows/docker-build.yml
    with:
      image_tag: ${{ needs.prepare.outputs.short_sha }}
      latest_tag: latest-dev
      build_migrator: ${{ vars.HOMELAB_STAGING_ENABLED == 'true' }}

  deploy:
    name: Deploy to dev
    needs: [prepare, build-images]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: staging
      app_spec: .do/app.dev.yaml
      image_tag: ${{ needs.prepare.outputs.short_sha }}

  deploy-homelab:
    name: Deploy to homelab staging
    needs: [prepare, build-images]
    if: vars.HOMELAB_STAGING_ENABLED == 'true'
    uses: ./.github/workflows/deploy-homelab.yml
    secrets: inherit
    with:
      environment: staging
      image_tag: ${{ needs.prepare.outputs.short_sha }}
