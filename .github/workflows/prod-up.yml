name: Prod — bring up

# Manual, on-demand recreation of the production app. Production is kept torn
# down by default (see "Production lifecycle" in
# docs/runbooks/infra-cost-reduction.md). Run this when you need prod live, then
# run "Prod — tear down" when you're finished.
#
# Recreating the app assigns a NEW app id and (without a custom domain) a NEW
# *.ondigitalocean.app URL. Deploys find the app by its spec name, so nothing needs updating.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR image tag to deploy (default: latest)"
        required: false
        default: latest

concurrency: prod-lifecycle

jobs:
  up:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f  # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Check whether prod app already exists
        id: check
        run: |
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header \
            | awk '$2=="xstockstrat-production"{print $1}')
          if [ -n "$APP_ID" ]; then
            echo "Prod app already running ($APP_ID) — nothing to do."
          fi
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-sops
        if: steps.check.outputs.app_id == ''

      - name: Render app spec (SOPS first, PROD_ fallback)
        id: render
        if: steps.check.outputs.app_id == ''
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          LEGACY_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          LEGACY_BROKER_ACCOUNTS_ENCRYPTION_KEY: ${{ secrets.PROD_BROKER_ACCOUNTS_ENCRYPTION_KEY }}
          LEGACY_CONFIG_SECRETS_ENCRYPTION_KEY: ${{ secrets.PROD_CONFIG_SECRETS_ENCRYPTION_KEY }}
          LEGACY_MTLS_CA: ${{ secrets.PROD_MTLS_CA }}
          LEGACY_SLACK_WEBHOOK_URL: ${{ secrets.PROD_SLACK_WEBHOOK_URL }}
          LEGACY_SENDGRID_API_KEY: ${{ secrets.PROD_SENDGRID_API_KEY }}
          LEGACY_VAPID_PRIVATE_KEY: ${{ secrets.PROD_VAPID_PRIVATE_KEY }}
          LEGACY_VAPID_PUBLIC_KEY: ${{ secrets.PROD_VAPID_PUBLIC_KEY }}
          LEGACY_VAPID_SUBJECT: ${{ secrets.PROD_VAPID_SUBJECT }}
          LEGACY_OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.PROD_OTEL_EXPORTER_OTLP_ENDPOINT }}
          LEGACY_OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.PROD_OTEL_EXPORTER_OTLP_HEADERS }}
          LEGACY_PROJECT_ID: ${{ secrets.DO_PROD_PROJECT_ID }}
        run: >-
          python3 scripts/do-render-app-spec.py
          --env production
          --spec .do/app.yaml
          --app-name xstockstrat-production
          --image-tag "${{ inputs.image_tag }}"
          --org "${{ github.repository_owner }}"
          --out "$RUNNER_TEMP/app.yaml"

      - name: Create prod app
        if: steps.check.outputs.app_id == ''
        id: create
        run: |
          APP_ID=$(doctl apps create --spec "$RUNNER_TEMP/app.yaml" --format ID --no-header)
          echo "Created app $APP_ID"
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"

      - name: Assign to project
        if: steps.create.outputs.app_id != ''
        env:
          DO_PROJECT_ID: ${{ steps.render.outputs.project_id }}
        run: |
          if [ -n "$DO_PROJECT_ID" ]; then
            doctl projects resources assign "$DO_PROJECT_ID" \
              --resource "do:app:${{ steps.create.outputs.app_id }}"
          else
            echo "digitalocean.PROJECT_ID not set — app stays in the default project."
          fi

      - name: Wait for deployment
        if: steps.create.outputs.app_id != ''
        run: |
          APP_ID="${{ steps.create.outputs.app_id }}"
          for i in $(seq 1 60); do
            DEPLOY_ID=$(doctl apps list-deployments "$APP_ID" --format ID --no-header | head -1)
            PHASE=$(doctl apps get-deployment "$APP_ID" "$DEPLOY_ID" --format Phase --no-header)
            echo "  [$i/60] Phase: $PHASE"
            if [ "$PHASE" = "ACTIVE" ]; then
              echo "Deployment succeeded."
              break
            elif [ "$PHASE" = "ERROR" ] || [ "$PHASE" = "CANCELED" ]; then
              echo "Deployment failed with phase: $PHASE"
              exit 1
            fi
            sleep 15
          done

      - name: Report URL and app id
        if: steps.create.outputs.app_id != ''
        run: |
          APP_ID="${{ steps.create.outputs.app_id }}"
          URL=$(doctl apps get "$APP_ID" --format DefaultIngress --no-header)
          echo "Production is up at: $URL (app id $APP_ID)"

      - name: Remove the rendered spec
        if: always()
        run: rm -f "$RUNNER_TEMP/app.yaml"
