name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      app_spec:
        description: 'Path to the DO app spec file'
        required: true
        type: string
      image_tag:
        description: 'Short SHA to inject as YOUR_IMAGE_TAG in the app spec'
        required: true
        type: string
    secrets:
      DIGITALOCEAN_ACCESS_TOKEN:
        required: true
      DO_APP_ID:
        required: true
      DO_PROJECT_ID:
        required: false  # Set DO_DEV_PROJECT_ID / DO_PROD_PROJECT_ID in GitHub Secrets.
                         # Find your project ID: doctl projects list
                         # Without this the app lands in the account's default project.
      BROKER_ACCOUNTS_ENCRYPTION_KEY:
        required: true
        # Callers pass DEV_BROKER_ACCOUNTS_ENCRYPTION_KEY or PROD_BROKER_ACCOUNTS_ENCRYPTION_KEY
        # from GitHub Secrets into this unified parameter.
      JWT_SECRET:
        required: true
        # Callers pass DEV_JWT_SECRET or PROD_JWT_SECRET from GitHub Secrets. Also injected into the
        # agent block (feature 147: it HMAC-signs the OAuth txn blob).
      CONFIG_SECRETS_ENCRYPTION_KEY:
        required: true
        # Feature 147: AES-256 master key for encrypting config secrets at rest. Callers pass
        # DEV_CONFIG_SECRETS_ENCRYPTION_KEY or PROD_CONFIG_SECRETS_ENCRYPTION_KEY from GitHub Secrets.
        # The vendor credentials (Alpaca/FMP/Finnhub) are no longer deploy secrets — they live in
        # encrypted config and are set post-deploy through the config write path.
      SLACK_WEBHOOK_URL:
        required: false
        # Callers pass DEV_SLACK_WEBHOOK_URL or PROD_SLACK_WEBHOOK_URL from GitHub Secrets. Optional —
        # notify external fanout is off until set (feature 020). App-level notify secret delivered as
        # a type: SECRET env var (like JWT_SECRET), not a data-source vendor credential.
      SENDGRID_API_KEY:
        required: false
        # Callers pass DEV_SENDGRID_API_KEY or PROD_SENDGRID_API_KEY from GitHub Secrets. Optional —
        # email fanout is off until the key AND both addresses are set (feature 020).

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Substitute app spec placeholders
        env:
          BROKER_ACCOUNTS_ENCRYPTION_KEY: ${{ secrets.BROKER_ACCOUNTS_ENCRYPTION_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CONFIG_SECRETS_ENCRYPTION_KEY: ${{ secrets.CONFIG_SECRETS_ENCRYPTION_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          sed \
            -e "s|YOUR_GITHUB_ORG|${{ github.repository_owner }}|g" \
            -e "s|YOUR_IMAGE_TAG|${{ inputs.image_tag }}|g" \
            ${{ inputs.app_spec }} \
          | BROKER_ACCOUNTS_ENCRYPTION_KEY="$BROKER_ACCOUNTS_ENCRYPTION_KEY" \
            JWT_SECRET="$JWT_SECRET" \
            CONFIG_SECRETS_ENCRYPTION_KEY="$CONFIG_SECRETS_ENCRYPTION_KEY" \
            SLACK_WEBHOOK_URL="$SLACK_WEBHOOK_URL" \
            SENDGRID_API_KEY="$SENDGRID_API_KEY" \
            python3 -c "
          import os, sys
          content = sys.stdin.read()
          key = os.environ['BROKER_ACCOUNTS_ENCRYPTION_KEY']
          content = content.replace('YOUR_DEV_BROKER_ACCOUNTS_ENCRYPTION_KEY', key)
          content = content.replace('YOUR_PROD_BROKER_ACCOUNTS_ENCRYPTION_KEY', key)
          jwt = os.environ['JWT_SECRET']
          content = content.replace('YOUR_DEV_JWT_SECRET', jwt)
          content = content.replace('YOUR_PROD_JWT_SECRET', jwt)
          cfg_key = os.environ['CONFIG_SECRETS_ENCRYPTION_KEY']
          content = content.replace('YOUR_DEV_CONFIG_SECRETS_ENCRYPTION_KEY', cfg_key)
          content = content.replace('YOUR_PROD_CONFIG_SECRETS_ENCRYPTION_KEY', cfg_key)
          slack_url = os.environ.get('SLACK_WEBHOOK_URL', '')
          content = content.replace('YOUR_DEV_SLACK_WEBHOOK_URL', slack_url)
          content = content.replace('YOUR_PROD_SLACK_WEBHOOK_URL', slack_url)
          sendgrid_key = os.environ.get('SENDGRID_API_KEY', '')
          content = content.replace('YOUR_DEV_SENDGRID_API_KEY', sendgrid_key)
          content = content.replace('YOUR_PROD_SENDGRID_API_KEY', sendgrid_key)
          sys.stdout.write(content)
          " > /tmp/app_spec_substituted.yaml

      - name: Deploy to DigitalOcean App Platform
        # --update-sources forces DO to re-evaluate the branch and build from the
        # current HEAD instead of the pinned commit stored from the last deploy.
        run: doctl apps update ${{ secrets.DO_APP_ID }} --spec /tmp/app_spec_substituted.yaml --update-sources

      - name: Assign app to DO project
        continue-on-error: true
        env:
          DO_PROJECT_ID: ${{ secrets.DO_PROJECT_ID }}
        run: |
          if [ -n "$DO_PROJECT_ID" ]; then
            echo "Assigning app to project $DO_PROJECT_ID ..."
            doctl projects resources assign "$DO_PROJECT_ID" \
              --resource "do:app:${{ secrets.DO_APP_ID }}"
          else
            echo "DO_PROJECT_ID not set — app stays in default project."
          fi

      - name: Wait for deployment
        run: |
          APP_ID="${{ secrets.DO_APP_ID }}"
          DEPLOY_ID=$(doctl apps list-deployments "$APP_ID" --format ID --no-header | head -1)
          echo "Waiting for deployment $DEPLOY_ID ..."
          for i in $(seq 1 60); do
            PHASE=$(doctl apps get-deployment "$APP_ID" "$DEPLOY_ID" --format Phase --no-header)
            echo "  [$i/60] Phase: $PHASE"
            if [ "$PHASE" = "ACTIVE" ]; then
              echo "Deployment succeeded."
              exit 0
            elif [ "$PHASE" = "ERROR" ] || [ "$PHASE" = "CANCELED" ]; then
              echo "Deployment failed with phase: $PHASE"
              exit 1
            fi
            sleep 15
          done
          echo "Timeout: deployment did not complete within 15 minutes."
          exit 1
