name: Deploy (reusable)

# Secrets come from secrets/<env>.enc.yaml (SOPS), falling back per key to the DEV_*/PROD_* repo secrets.
# Fallbacks are read only by their DEV_/PROD_ names, so an environment secret can never shadow them.
on:
  workflow_call:
    inputs:
      environment:
        description: 'staging or production (the GitHub environment holding SOPS_AGE_KEY)'
        required: true
        type: string
      app_spec:
        description: 'Path to the DO app spec file'
        required: true
        type: string
      image_tag:
        description: 'Short SHA to inject as YOUR_IMAGE_TAG in the app spec'
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Environment must be staging or production
        env:
          E: ${{ inputs.environment }}
        run: |
          case "$E" in staging|production) ;; *) echo "::error::environment must be staging or production"; exit 1;; esac

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      P: ${{ inputs.environment == 'production' && 'PROD' || 'DEV' }}
      APP_NAME: xstockstrat-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f  # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Resolve app ID by spec name
        id: resolve-app-id
        run: |
          ids=$(doctl apps list --format ID,Spec.Name --no-header | awk -v n="$APP_NAME" '$2==n{print $1}')
          n=$(printf '%s' "$ids" | grep -c . || true)
          if [ "$n" != 1 ]; then
            echo "::error::expected exactly 1 app named $APP_NAME, found $n"
            echo "expected exactly 1 app named $APP_NAME, found $n" >&2
            exit 1
          fi
          echo "APP_ID=$ids" >> "$GITHUB_ENV"
          echo "app: $APP_NAME → $ids" >> "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/setup-sops

      - name: Look up the database cluster (VPC + cluster ID)
        id: db
        env:
          SPEC: ${{ inputs.app_spec }}
        run: bash scripts/do-db-cluster.sh lookup

      - name: Render app spec (SOPS first, DEV_/PROD_ fallback)
        id: render
        env:
          VPC_ID: ${{ steps.db.outputs.vpc_id }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          LEGACY_JWT_SECRET: ${{ secrets[format('{0}_JWT_SECRET', env.P)] }}
          LEGACY_BROKER_ACCOUNTS_ENCRYPTION_KEY: ${{ secrets[format('{0}_BROKER_ACCOUNTS_ENCRYPTION_KEY', env.P)] }}
          LEGACY_CONFIG_SECRETS_ENCRYPTION_KEY: ${{ secrets[format('{0}_CONFIG_SECRETS_ENCRYPTION_KEY', env.P)] }}
          LEGACY_MTLS_CA: ${{ secrets[format('{0}_MTLS_CA', env.P)] }}
          LEGACY_SLACK_WEBHOOK_URL: ${{ secrets[format('{0}_SLACK_WEBHOOK_URL', env.P)] }}
          LEGACY_SENDGRID_API_KEY: ${{ secrets[format('{0}_SENDGRID_API_KEY', env.P)] }}
          LEGACY_VAPID_PRIVATE_KEY: ${{ secrets[format('{0}_VAPID_PRIVATE_KEY', env.P)] }}
          LEGACY_VAPID_PUBLIC_KEY: ${{ secrets[format('{0}_VAPID_PUBLIC_KEY', env.P)] }}
          LEGACY_VAPID_SUBJECT: ${{ secrets[format('{0}_VAPID_SUBJECT', env.P)] }}
          LEGACY_OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets[format('{0}_OTEL_EXPORTER_OTLP_ENDPOINT', env.P)] }}
          LEGACY_OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets[format('{0}_OTEL_EXPORTER_OTLP_HEADERS', env.P)] }}
          LEGACY_PROJECT_ID: ${{ secrets[format('DO_{0}_PROJECT_ID', env.P)] }}
        run: >-
          python3 scripts/do-render-app-spec.py
          --env "${{ inputs.environment }}"
          --spec "${{ inputs.app_spec }}"
          --app-name "$APP_NAME"
          --image-tag "${{ inputs.image_tag }}"
          --org "${{ github.repository_owner }}"
          --vpc-id "$VPC_ID"
          --out "$RUNNER_TEMP/app.yaml"

      - name: Deploy to DigitalOcean App Platform
        # --update-sources forces DO to re-evaluate the branch and build from the
        # current HEAD instead of the pinned commit stored from the last deploy.
        run: doctl apps update "$APP_ID" --spec "$RUNNER_TEMP/app.yaml" --update-sources

      - name: Assign app to DO project
        continue-on-error: true
        env:
          DO_PROJECT_ID: ${{ steps.render.outputs.project_id }}
        run: |
          if [ -n "$DO_PROJECT_ID" ]; then
            echo "Assigning app to project $DO_PROJECT_ID ..."
            doctl projects resources assign "$DO_PROJECT_ID" \
              --resource "do:app:$APP_ID"
          else
            echo "digitalocean.PROJECT_ID not set — app stays in default project."
          fi

      - name: Wait for deployment
        run: |
          DEPLOY_ID=$(doctl apps list-deployments "$APP_ID" --format ID --no-header | head -1)
          echo "Waiting for deployment $DEPLOY_ID ..."
          for i in $(seq 1 60); do
            PHASE=$(doctl apps get-deployment "$APP_ID" "$DEPLOY_ID" --format Phase --no-header)
            echo "  [$i/60] Phase: $PHASE"
            if [ "$PHASE" = "ACTIVE" ]; then
              echo "Deployment succeeded."
              exit 0
            elif [ "$PHASE" = "SUPERSEDED" ]; then
              echo "::warning::Deployment $DEPLOY_ID was superseded by a newer deployment; that deployment's run reports its outcome."
              exit 0
            elif [ "$PHASE" = "ERROR" ] || [ "$PHASE" = "CANCELED" ]; then
              echo "Deployment failed with phase: $PHASE"
              exit 1
            fi
            sleep 15
          done
          echo "Timeout: deployment did not complete within 15 minutes."
          exit 1

      - name: Remove the rendered spec
        if: always()
        run: rm -f "$RUNNER_TEMP/app.yaml"
