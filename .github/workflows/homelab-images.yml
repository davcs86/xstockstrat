# Manual: build every image plus xstockstrat-db-migrator for the dispatched ref, so deploy-homelab.yml can be
# dispatched with the resulting image_tag when HOMELAB_*_ENABLED is off (the push workflows skip the migrator then).
name: Build homelab images

on:
  workflow_dispatch:
    inputs:
      ui_theme:
        description: 'UI build theme for xstockstrat-ui — must match the deploy target environment'
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - id: sha
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  build-images:
    needs: [prepare]
    uses: ./.github/workflows/docker-build.yml
    with:
      image_tag: ${{ needs.prepare.outputs.short_sha }}
      latest_tag: homelab-manual
      build_migrator: true
      ui_theme: ${{ inputs.ui_theme }}

  summary:
    needs: [prepare, build-images]
    runs-on: ubuntu-latest
    steps:
      - env:
          TAG: ${{ needs.prepare.outputs.short_sha }}
          UI_THEME: ${{ inputs.ui_theme }}
        run: echo "Dispatch **Deploy homelab** with image_tag \`$TAG\` (UI theme \`$UI_THEME\`, deploy only to that environment)." >> "$GITHUB_STEP_SUMMARY"
