name: CI

on:
  pull_request:
  push:
    branches:
      - main-dev
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    # Never guard this job: a skip here skips every downstream job and ci-gate treats skipped as pass.
    runs-on: ubuntu-latest
    # Scoped to this job only. A workflow-level `permissions:` block sets
    # every unlisted scope to `none` for ALL jobs, which silently strips
    # write scopes that other actions (golangci-lint annotations, gitleaks
    # PR comments, actions/cache writes) need. paths-filter is the only
    # action here that calls the GitHub API, so grant pull-requests:read
    # locally and let every other job inherit the repo default.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matched: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Each filter name is referenced verbatim by downstream `if:` gates.
          # Service filter names MUST match the matrix.service values exactly.
          # paths-filter@v4 emits a default `changes` output: a JSON array of
          # filter names that matched. That array is what downstream jobs read
          # via needs.changes.outputs.matched — no extra jq step required.
          filters: |
            ci:
              - '.github/workflows/ci.yml'
            proto:
              - 'packages/proto/**'
              - 'scripts/buf-gen.sh'
            go-shared:
              - 'go.work'
              - 'go.work.sum'
            node-shared:
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            xstockstrat-trading:    ['services/xstockstrat-trading/**']
            xstockstrat-marketdata: ['services/xstockstrat-marketdata/**']
            xstockstrat-portfolio:  ['services/xstockstrat-portfolio/**', 'scripts/config-wiring-stored.json']
            xstockstrat-indicators: ['services/xstockstrat-indicators/**']
            xstockstrat-ingest:     ['services/xstockstrat-ingest/**']
            xstockstrat-analysis:   ['services/xstockstrat-analysis/**']
            xstockstrat-agent:      ['services/xstockstrat-agent/**', 'services/xstockstrat-analysis/app/handlers/servicer.py', 'services/xstockstrat-trading/internal/service/trading.go', 'services/xstockstrat-ingest/app/handlers/servicer.py']
            xstockstrat-config:     ['services/xstockstrat-config/**']
            xstockstrat-ledger:     ['services/xstockstrat-ledger/**']
            xstockstrat-identity:   ['services/xstockstrat-identity/**']
            xstockstrat-notify:     ['services/xstockstrat-notify/**']
            xstockstrat-ui:         ['services/xstockstrat-ui/**', '.do/**']
            dockerfiles:
              - '**/Dockerfile*'
              - '.hadolint.yaml'
            scripts:
              - 'scripts/**'
              - '.claude/hooks/**'
              - '.github/workflows/deploy.yml'
              - '.github/workflows/docker-build.yml'
              - '.github/workflows/deploy-dev.yml'
              - '.github/workflows/deploy-prod.yml'
              - '.github/workflows/prod-up.yml'
              - '.github/workflows/staging-up.yml'
              - '.github/workflows/homelab-images.yml'
              - '.github/workflows/deploy-homelab.yml'
              - '.github/workflows/sync-main-to-maindev.yml'
              - '.github/workflows/promote.yml'
              - '.github/PULL_REQUEST_TEMPLATE/hotfix.md'
              - '.github/PULL_REQUEST_TEMPLATE/promotion.md'
              - 'docs/runbooks/feature-workflow.md'
              - 'docs/runbooks/bug-triage.md'
              - '.claude/skills/sdd-triage/reference/backmerge.md'
              - '.claude/skills/promote/SKILL.md'
            migrations:
              - 'services/*/migrations/**'
              - 'scripts/db-migrate.sh'
              - 'scripts/render-migrations.sh'
              - 'scripts/migration-dirty-guard.sh'
              - 'scripts/migration-ahead-check.sh'
              - 'scripts/migration-rerun.sh'
              - 'scripts/migration-assertions/**'
              - 'scripts/Dockerfile.migrate'
              - 'services/xstockstrat-indicators/app/services/formulas_repository.py'
            homelab:
              - 'deploy/homelab/**'
              - 'scripts/homelab-*'
              - 'scripts/gen-dev-certs.sh'
              - 'scripts/mtls-provision.sh'
              - '.github/workflows/deploy-homelab.yml'
            sops:
              - 'scripts/sops_secrets.py'
              - 'scripts/do-render-app-spec.py'
              - 'scripts/do-db-cluster.sh'
              - 'scripts/sops-secrets.test.sh'
              - 'scripts/ui-theme-label.sh'
              - '.github/actions/setup-sops/**'
              - '.github/workflows/deploy*.yml'
              - '.github/workflows/prod-up.yml'
              - '.github/workflows/prod-down.yml'
              - '.github/workflows/staging-up.yml'
              - '.github/workflows/staging-down.yml'
              - '.github/workflows/sops-bootstrap.yml'
              - '.do/**'
              - '.sops.yaml'
              - 'secrets/**'
            ui-theme:
              - 'services/xstockstrat-ui/src/styles/**'
              - 'services/xstockstrat-ui/src/app/globals.css'
              - 'services/xstockstrat-ui/src/app/layout.tsx'
              - 'services/xstockstrat-ui/src/app/manifest.webmanifest/**'
              - 'services/xstockstrat-ui/src/app/insights/**'
              - 'services/xstockstrat-ui/src/components/insights/**'
              - 'services/xstockstrat-ui/src/components/ui/sidebar.tsx'
              - 'services/xstockstrat-ui/src/lib/chartColors.ts'
              - 'services/xstockstrat-ui/src/hooks/useCandlestickChart.ts'
              - 'services/xstockstrat-ui/next.config.js'
              - 'services/xstockstrat-ui/postcss.config.js'
              - 'services/xstockstrat-ui/package.json'
              - 'services/xstockstrat-ui/Dockerfile'
              - 'services/xstockstrat-ui/playwright.config.ts'
              - 'services/xstockstrat-ui/e2e/theme/**'
              - 'services/xstockstrat-ui/e2e/helpers/**'
              - 'services/xstockstrat-ui/e2e/fixtures/**'
              - 'services/xstockstrat-ui/e2e/mock-backend.ts'
              - 'Dockerfile.e2e'
            ledger:
              - 'docs/roadmap/ledger/**'
              - 'scripts/ledger-guard.py'
            claude-md:
              - '**/CLAUDE.md'
              - '.markdownlint.yaml'
            context-map:
              - '.claude/context-map.yaml'
              - '.claude/agents/**'
              - '.claude/skills/**'
              - '.claude/workflows/**'
              - 'scripts/workflow-tests/**'
              - 'scripts/merge-train-resolve.mjs'
              - 'scripts/check-context-map.py'
              - 'docs/**'
              - '**/CLAUDE.md'
            otel-signals:
              - 'packages/otel/**'
              - 'packages/proto/**/*.proto'
              - 'docs/**'
              - '.do/**'
              - 'docker-compose.yml'
              - 'deploy/homelab/compose.yml'
              - 'scripts/check-otel-produced-signals.py'
              - 'scripts/testdata/otel-produced-signals/**'
            config-wiring:
              - 'services/xstockstrat-config/migrations/**'
              - 'services/**/*.go'
              - 'services/*/app/**/*.py'
              - 'services/*/src/**/*.ts'
              - 'services/*/src/**/*.tsx'
              - 'scripts/check-config-wiring.mjs'
              - 'scripts/config-wiring-py-reads.py'
              - 'scripts/config-wiring.json'
              - 'scripts/config-wiring.test.mjs'
              - 'scripts/config-wiring-fixtures/**'
              - 'scripts/config-wiring-stored.json'
              - 'scripts/config-wiring-stored.sh'
              - 'scripts/config-heal/**'
              - 'docs/sdd/constitution.md'
              - 'services/xstockstrat-config/docs/context-constitution.md'
              - 'docs/patterns/config-governance.md'
              - 'CLAUDE.md'
              - 'services/*/CLAUDE.md'
              - 'docs/runbooks/config-rollout.md'
              - '.claude/skills/sdd-story/SKILL.md'
              - '.claude/skills/sdd-spec/reference/spec-template.md'
              - '.claude/skills/sdd-review/reference/product-spec-criteria.md'
              - '.claude/skills/sdd-review/reference/impl-spec-criteria.md'
              - '.claude/skills/sdd-execute/reference/repo-conventions.md'
              - '.claude/agents/spec-reviewer.md'
              - '.claude/agents/codebase-discovery.md'
              - 'scripts/check-watcher-copies.py'
              - 'services/xstockstrat-trading/internal/config/watchcore.go'
              - 'services/xstockstrat-portfolio/internal/config/watchcore.go'
              - 'services/xstockstrat-marketdata/internal/config/watchcore.go'
            config-wiring-stored:
              - 'services/xstockstrat-config/migrations/**'
              - 'scripts/config-wiring-stored.sh'
              - 'scripts/config-wiring-stored.json'
              - 'scripts/render-migrations.sh'
              - 'scripts/db-migrate.sh'
              - 'scripts/config-heal-dryrun.sh'
              - 'scripts/config-heal/**'
              - 'scripts/Dockerfile.migrate'

      - name: Print matched filters
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref:   ${{ github.ref }}"
          echo "SHA:   ${{ github.sha }}"
          echo "Matched filters: ${{ steps.filter.outputs.changes }}"

  proto-lint:
    name: Proto lint and breaking check
    needs: changes
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'proto') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history required for buf breaking against the target branch
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.72.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: buf lint
        run: buf lint packages/proto/

      - name: buf breaking (against target branch)
        working-directory: packages/proto
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            AGAINST="../../.git#branch=origin/${{ github.base_ref }},subdir=packages/proto"
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "Initial push — no prior ref to compare against, skipping"
              exit 0
            fi
            AGAINST="../../.git#ref=${BEFORE},subdir=packages/proto"
          fi
          echo "Checking breaking changes against ${AGAINST}"
          # TEMPORARY: feature/order-time-in-force-enum — the intentional string→enum wire-type
          # change on Order/PlaceOrderRequest/ReplaceOrderRequest.time_in_force is expected to trip
          # buf breaking. Remove this --exclude-path in the integration PR that merges the feature.
          buf breaking . --against "${AGAINST}" --exclude-path trading/v1/trading.proto

  proto-freshness:
    name: Proto stubs are up to date
    needs: changes
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'proto') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.72.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: packages/proto/go.sum

      - name: Install Go proto plugins
        # These pins are duplicated in Dockerfile.codegen's "Go proto plugins" step
        # (this job installs its own copies rather than building that image, so a
        # drift between the two goes uncaught). Bump both together; see
        # CLAUDE.md §Version Bump Workflow.
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install Python gRPC tools
        run: pip install grpcio-tools==1.80.0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate stubs
        run: bash ./scripts/buf-gen.sh

      - name: Check for stale stubs
        run: |
          git diff --exit-code packages/proto/gen/ || \
          (echo "Committed stubs are stale — run ./scripts/buf-gen.sh and commit the result" && exit 1)

  go-lint:
    name: Go lint and test (${{ matrix.service }})
    needs: changes
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-trading') ||
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-marketdata') ||
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-portfolio') ||
      contains(fromJson(needs.changes.outputs.matched), 'proto') ||
      contains(fromJson(needs.changes.outputs.matched), 'go-shared') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: xstockstrat-trading
            coverage_threshold: 40
          - service: xstockstrat-marketdata
            coverage_threshold: 40
          - service: xstockstrat-portfolio
            coverage_threshold: 40
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: go mod download
        run: go mod download
        env:
          GOWORK: "off"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: services/${{ matrix.service }}
          args: --modules-download-mode=mod
        env:
          GOWORK: "off"

      - name: go test with coverage
        run: |
          # Exclude infrastructure packages from coverage measurement:
          #   cmd        — entry point, not unit-testable
          #   handler    — gRPC/HTTP transport layer, requires integration setup
          #   repository — database layer, requires a live DB
          #   telemetry  — observability plumbing
          #   service    — business logic that depends on gRPC clients/DB; only
          #                pure helper functions are unit-tested, making overall
          #                service coverage misleadingly low; service logic is
          #                covered by integration tests.
          # Only config and broker/alpaca packages contain fully unit-testable
          # pure logic and are included in the threshold check.
          COVERPKGS=$(go list ./... | grep -Ev '/(cmd|handler|repository|telemetry|service)(/|$)' | tr '\n' ',' | sed 's/,$//')
          go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic -coverpkg="${COVERPKGS}"
        env:
          GOWORK: "off"

      - name: coverage report
        run: go tool cover -func=coverage.out

      - name: enforce coverage threshold
        run: |
          THRESHOLD=${{ matrix.coverage_threshold }}
          COVERAGE=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%  Threshold: ${THRESHOLD}%"
          python3 -c "
          import sys
          c = float('${COVERAGE}')
          t = float('${THRESHOLD}')
          if c >= t:
              print(f'OK: {c:.1f}% >= {t}%')
          else:
              print(f'FAIL: {c:.1f}% < {t}%')
              sys.exit(1)
          "

      - name: upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.out
          if-no-files-found: ignore

  python-lint:
    name: Python lint (${{ matrix.service }})
    needs: changes
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-indicators') ||
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-ingest') ||
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-analysis') ||
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-agent') ||
      contains(fromJson(needs.changes.outputs.matched), 'proto') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - xstockstrat-indicators
          - xstockstrat-ingest
          - xstockstrat-analysis
          - xstockstrat-agent
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: 'pip'
          cache-dependency-path: services/${{ matrix.service }}/pyproject.toml

      - name: install ruff and uv
        run: pip install ruff uv

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      # Root CLAUDE.md § Python uv lock rule says this is enforced in CI. Until now it was not —
      # no workflow referenced uv at all — so a pyproject.toml change could land with a stale
      # uv.lock and only surface at Docker build time, where `uv sync --frozen` (e.g.
      # services/xstockstrat-agent/Dockerfile:6) fails the image build instead of the PR.
      - name: uv.lock is in sync with pyproject.toml
        run: uv lock --check

  python-test:
    name: Python test and coverage (${{ matrix.service }})
    needs: changes
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-indicators') ||
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-ingest') ||
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-analysis') ||
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-agent') ||
      contains(fromJson(needs.changes.outputs.matched), 'proto') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: xstockstrat-indicators
            coverage_threshold: 50
            cov_source: app
          - service: xstockstrat-ingest
            coverage_threshold: 40
            cov_source: app
          - service: xstockstrat-analysis
            coverage_threshold: 40
            cov_source: app
          - service: xstockstrat-agent
            coverage_threshold: 40
            cov_source: app
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: 'pip'
          cache-dependency-path: services/${{ matrix.service }}/pyproject.toml

      - name: install uv
        run: pip install uv

      # Install from uv.lock (not a floating `pip install -e`) so the test env
      # matches the locked deps — the same lock Docker builds with. Prevents an
      # unpinned transitive (e.g. mcp 2.0) from silently drifting into CI.
      - name: install dependencies (locked)
        run: uv sync --frozen --extra dev

      # The indicators formula sandbox (feature 209) loads a seccomp-BPF filter via pyseccomp,
      # which dlopens libseccomp.so.2. The Docker image installs libseccomp2; this job runs on the
      # bare runner, where it is not guaranteed present, so install it to keep the sandbox tests
      # enforcing the real filter (not skipping it) — environment parity with prod.
      - name: install libseccomp (indicators sandbox)
        if: matrix.service == 'xstockstrat-indicators'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libseccomp2

      # The analysis real_pg tests start a throwaway PostgreSQL from local binaries (tests/conftest.py
      # local_pg) and fail rather than skip under CI, so the binaries must be present.
      - name: install postgresql (analysis real_pg tests)
        if: matrix.service == 'xstockstrat-analysis'
        run: ls /usr/lib/postgresql/*/bin/initdb || (sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql)

      - name: pytest with coverage
        run: |
          uv run --no-sync pytest --cov=${{ matrix.cov_source }} \
                 --cov-report=xml:coverage.xml \
                 --cov-report=term-missing \
                 --cov-fail-under=${{ matrix.coverage_threshold }}

      - name: upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml
          if-no-files-found: ignore

  node-lint:
    name: Node lint (${{ matrix.service }})
    needs: changes
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-config') ||
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-ledger') ||
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-identity') ||
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-notify') ||
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-ui') ||
      contains(fromJson(needs.changes.outputs.matched), 'proto') ||
      contains(fromJson(needs.changes.outputs.matched), 'node-shared') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - xstockstrat-config
          - xstockstrat-ledger
          - xstockstrat-identity
          - xstockstrat-notify
          - xstockstrat-ui
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: build proto stubs
        run: pnpm --filter @xstockstrat/proto run build

      - name: lint
        working-directory: services/${{ matrix.service }}
        run: pnpm run lint

  e2e-build:
    name: Build E2E image
    needs: changes
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-ui') ||
      contains(fromJson(needs.changes.outputs.matched), 'proto') ||
      contains(fromJson(needs.changes.outputs.matched), 'node-shared') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: build e2e image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.e2e
          tags: xstockstrat-e2e:ci
          load: true
          cache-from: type=gha,scope=e2e-build
          cache-to: type=gha,scope=e2e-build,mode=max

      - name: export e2e image
        run: docker save xstockstrat-e2e:ci | zstd -3 -T0 -o /tmp/e2e-image.tar.zst

      - name: upload e2e image
        uses: actions/upload-artifact@v7
        with:
          name: e2e-image
          path: /tmp/e2e-image.tar.zst
          retention-days: 1
          compression-level: 0

  frontend-e2e:
    name: Frontend E2E (shard ${{ matrix.shard }}/2)
    needs: [changes, e2e-build]
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-ui') ||
      contains(fromJson(needs.changes.outputs.matched), 'proto') ||
      contains(fromJson(needs.changes.outputs.matched), 'node-shared') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: download e2e image
        uses: actions/download-artifact@v7
        with:
          name: e2e-image

      - name: load e2e image
        run: zstd -d -T0 e2e-image.tar.zst --stdout | docker load

      - name: run e2e tests
        run: |
          docker run \
            --name e2e-shard-${{ matrix.shard }} \
            xstockstrat-e2e:ci \
            --shard=${{ matrix.shard }}/2

      - name: AC-10 staging theme under each APPLICATION_ENV
        if: matrix.shard == 1
        run: |
          for env in staging production; do
            echo "AC-10 run with APPLICATION_ENV=$env"
            docker run --rm -e E2E_APPLICATION_ENV="$env" xstockstrat-e2e:ci e2e/theme/theme-bundle.spec.ts --grep @AC-10 || exit 1
          done

      - name: extract playwright report
        if: always()
        run: |
          docker cp e2e-shard-${{ matrix.shard }}:/workspace/services/xstockstrat-ui/playwright-report ./playwright-report 2>/dev/null || true
          docker rm e2e-shard-${{ matrix.shard }} 2>/dev/null || true

      - name: upload playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  frontend-e2e-production:
    name: Frontend E2E (production theme)
    needs: changes
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'ui-theme') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: build production-theme e2e image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.e2e
          build-args: UI_THEME=production
          tags: xstockstrat-e2e:prod
          load: true
          cache-from: |
            type=gha,scope=e2e-build
            type=gha,scope=e2e-build-production
          cache-to: type=gha,scope=e2e-build-production,mode=max

      - name: run production-theme e2e (theme specs; AC-10 excluded)
        run: |
          docker run \
            --name e2e-production \
            xstockstrat-e2e:prod \
            e2e/theme/ --grep-invert @AC-10

      - name: extract playwright report
        if: always()
        run: |
          docker cp e2e-production:/workspace/services/xstockstrat-ui/playwright-report ./playwright-report 2>/dev/null || true
          docker rm e2e-production 2>/dev/null || true

      - name: upload playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-production
          path: playwright-report/
          retention-days: 7

  ui-prod-image-build:
    name: UI production image (theme label + CSS check)
    needs: changes
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'ui-theme') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: build production UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/xstockstrat-ui/Dockerfile
          build-args: UI_THEME=production
          tags: xstockstrat-ui:prod-ci
          load: true
          push: false
          cache-from: |
            type=gha,scope=xstockstrat-ui
            type=gha,scope=ui-prod-image-build
          cache-to: type=gha,scope=ui-prod-image-build,mode=max

      - name: assert theme label and re-check the image's CSS
        run: |
          [ "$(docker inspect -f '{{ index .Config.Labels "io.xstockstrat.ui-theme" }}' xstockstrat-ui:prod-ci)" = production ] || { echo "::error::ui-theme label is not production"; exit 1; }
          cid=$(docker create xstockstrat-ui:prod-ci)
          docker cp "$cid:/app/services/xstockstrat-ui/.next/static/css" "$RUNNER_TEMP/ui-css"
          docker rm "$cid" >/dev/null
          UI_THEME=production node services/xstockstrat-ui/src/styles/themes/checkThemeBundle.cjs --css-dir "$RUNNER_TEMP/ui-css"

  node-test:
    name: Node test and coverage (${{ matrix.service }})
    needs: changes
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-config') ||
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-ledger') ||
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-identity') ||
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-notify') ||
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-ui') ||
      contains(fromJson(needs.changes.outputs.matched), 'proto') ||
      contains(fromJson(needs.changes.outputs.matched), 'node-shared') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: xstockstrat-config
            coverage_threshold: 40
          - service: xstockstrat-ledger
            coverage_threshold: 40
          - service: xstockstrat-identity
            coverage_threshold: 40
          - service: xstockstrat-notify
            coverage_threshold: 40
          # xstockstrat-ui runs the vitest unit suite (feature 065); the real coverage gate is
          # vitest's own scoped src/lib threshold (vitest.config.ts) — this entry just runs it.
          - service: xstockstrat-ui
            coverage_threshold: 40
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: build proto stubs
        run: pnpm --filter @xstockstrat/proto run build

      - name: test with coverage
        working-directory: services/${{ matrix.service }}
        run: pnpm run test:coverage

      - name: upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage/lcov.info
          if-no-files-found: ignore

  dockerfile-lint:
    name: Dockerfile lint (hadolint)
    needs: changes
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'dockerfiles') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          recursive: true
          config: .hadolint.yaml

  shell-lint:
    name: Shell script lint (shellcheck + shfmt)
    needs: changes
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'scripts') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck and shfmt
        run: sudo apt-get install -y shellcheck shfmt

      - name: shellcheck
        run: shellcheck scripts/*.sh .claude/hooks/*.sh

      - name: shfmt (diff check)
        run: shfmt -d -i 2 scripts/*.sh .claude/hooks/*.sh

      - name: Migration tooling structural tests
        run: bash scripts/render-migrations.test.sh && bash scripts/migration-dirty-guard.test.sh && bash scripts/migration-ahead-check.test.sh && bash scripts/ui-theme-label.test.sh && bash scripts/backmerge-no-ff.test.sh && bash scripts/gen-dev-certs.test.sh

  # No path filter: a shell script can be added anywhere in the tree.
  shell-freeze:
    name: Shell freeze (no new shell scripts outside runtime images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check every shell script is allowlisted and the legacy set did not grow
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            python3 scripts/check-shell-freeze.py --base "origin/$BASE_REF"
          else
            python3 scripts/check-shell-freeze.py
          fi

  scripts-python:
    name: Scripts Python lint and test (ruff + pytest)
    needs: changes
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'scripts') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: install uv
        run: pip install uv

      - name: uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: install dev dependencies
        run: uv sync --extra dev --frozen

      - name: ruff check
        run: uv run --no-sync ruff check .

      - name: ruff format check
        run: uv run --no-sync ruff format --check .

      - name: pytest
        run: uv run --no-sync pytest

  # Applies every migration, then replays the chain from version 0 (the db-migrate.sh dirty-state
  # recovery path) and runs scripts/migration-assertions/*.sql — every up-file must be idempotent.
  migration-rerun:
    name: Migration rerun (idempotent replay)
    needs: changes
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'migrations') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci')
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: xstockstrat
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: xstockstrat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xstockstrat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Build migrator image (migrate + psql + envsubst)
        run: docker build -f scripts/Dockerfile.migrate -t xstockstrat-migrate-ci .

      - name: Migrator image ships the dirty guard and the ahead check (no bind mount)
        run: docker run --rm --entrypoint sh xstockstrat-migrate-ci -c 'test -x /repo/scripts/migration-dirty-guard.sh && test -f /repo/scripts/migration-ahead-check.sh'

      - name: Apply, replay and assert
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="postgres://xstockstrat:ci-only@localhost:5432/xstockstrat?sslmode=disable" \
            -e SEED_USER_ID="00000000-0000-4000-8000-0000000000c1" \
            -v "$PWD:/repo" -w /repo --entrypoint bash \
            xstockstrat-migrate-ci scripts/migration-rerun.sh

  # A `-- contract-of:` migration may only contract an expand file that is already on origin/main.
  # PR-only: github.base_ref is empty on push events.
  migration-contract-gate:
    name: Migration contract gate
    needs: changes
    if: >-
      github.event_name == 'pull_request' && (
      contains(fromJson(needs.changes.outputs.matched), 'migrations') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check contract migrations against origin/main
        run: |
          git fetch --no-tags origin main "${{ github.base_ref }}"
          python3 scripts/check-migration-contract.py "origin/${{ github.base_ref }}"

  # Needs a migrated TimescaleDB; test:db stays outside the node-test c8 coverage gate.
  ledger-db-test:
    name: Ledger DB test (TimescaleDB)
    needs: changes
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-ledger') ||
      contains(fromJson(needs.changes.outputs.matched), 'migrations') ||
      contains(fromJson(needs.changes.outputs.matched), 'proto') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci') ||
      contains(fromJson(needs.changes.outputs.matched), 'node-shared')
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: xstockstrat
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: xstockstrat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xstockstrat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: build proto stubs
        run: pnpm --filter @xstockstrat/proto run build

      - name: Build migrator image (migrate + psql + envsubst)
        run: docker build -f scripts/Dockerfile.migrate -t xstockstrat-migrate-ci .

      - name: Apply migrations
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="postgres://xstockstrat:ci-only@localhost:5432/xstockstrat?sslmode=disable" \
            -e SEED_USER_ID="00000000-0000-4000-8000-0000000000c1" \
            xstockstrat-migrate-ci

      - name: test:db
        working-directory: services/xstockstrat-ledger
        env:
          LEDGER_DB_TEST_URL: postgres://xstockstrat:ci-only@localhost:5432/xstockstrat?sslmode=disable
        run: pnpm run test:db

  # Real-Postgres repository tests (//go:build dbtest); excluded from the go-lint coverage run.
  portfolio-db-test:
    name: Portfolio DB test (TimescaleDB)
    needs: changes
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'xstockstrat-portfolio') ||
      contains(fromJson(needs.changes.outputs.matched), 'migrations') ||
      contains(fromJson(needs.changes.outputs.matched), 'proto') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci') ||
      contains(fromJson(needs.changes.outputs.matched), 'go-shared')
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: xstockstrat
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: xstockstrat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xstockstrat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: services/xstockstrat-portfolio/go.sum

      - name: Build migrator image (migrate + psql + envsubst)
        run: docker build -f scripts/Dockerfile.migrate -t xstockstrat-migrate-ci .

      - name: Apply migrations
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="postgres://xstockstrat:ci-only@localhost:5432/xstockstrat?sslmode=disable" \
            -e SEED_USER_ID="00000000-0000-4000-8000-0000000000c1" \
            xstockstrat-migrate-ci

      - name: go test -tags dbtest
        working-directory: services/xstockstrat-portfolio
        env:
          GOWORK: "off"
          CI: "true"
          PORTFOLIO_DB_TEST_URL: postgres://xstockstrat:ci-only@localhost:5432/xstockstrat?sslmode=disable
        run: go test -tags dbtest -race -count=1 ./internal/repository/...

  markdown-lint:
    name: CLAUDE.md lint (markdownlint)
    needs: changes
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'claude-md') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: .markdownlint.yaml
          globs: '**/CLAUDE.md'

  context-map:
    name: Context map references (AI tooling)
    needs: changes
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'context-map') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate context map and doc cross-references
        run: python3 scripts/check-context-map.py

      - name: Saved-workflow gate tests (no agents, no tokens)
        run: node --test scripts/workflow-tests/*.test.mjs

  otel-signals:
    name: OTel produced-signal guard
    needs: changes
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'otel-signals') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Alert/dashboard queries and observability docs name only exported signals
        run: python3 scripts/check-otel-produced-signals.py

      # scripts-python only runs on scripts/** changes; these cases also depend on the assets above.
      - name: Guard regression cases against the current assets
        working-directory: scripts
        run: |
          pip install uv
          uv run --extra dev --frozen pytest tests/test_check_otel_produced_signals.py

  ledger-guard:
    name: Ledger guard (other features' entries kept)
    needs: changes
    if: >-
      github.event_name == 'pull_request' && (
      contains(fromJson(needs.changes.outputs.matched), 'ledger') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # HEAD is the PR's merge commit, i.e. what a merge would land on the base branch.
      - name: Check no other feature's ledger entry is deleted or altered
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/ledger-guard.py --own-slug "${HEAD_REF#feature/}" --base "origin/${BASE_REF}" --head HEAD

  secret-scan:
    name: Secret scan (trufflehog + gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action's PR mode calls GET /pulls/{n}/commits, which needs
    # pull-requests:read — the workflow-level default (contents:read only) 404s it.
    # Grant it here (same pattern as the `changes` job above) and let gitleaks use
    # the built-in GITHUB_TOKEN rather than a PAT for that API call.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history required for trufflehog git-history scan
          fetch-depth: 0

      - name: TruffleHog — scan git history
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # --exclude-detectors=Lob: the Lob (lob.com print/mail API) detector's key-shape regex
          # (test|live)_<35 alnum/underscore chars> false-positives on our long, descriptive
          # snake_case pytest test names (e.g. test_exit_fires_once_entry_time_resolves) and gets
          # spuriously "verified" — confirmed locally: same commit range scores verified_secrets:4
          # with the Lob detector active and verified_secrets:0 with it excluded, chunks/bytes
          # scanned unchanged. xstockstrat has no Lob integration, so disabling this one detector
          # costs no real coverage. PR #898 (feature 116-exit-cooldown) hit this first.
          extra_args: --only-verified --exclude-detectors=Lob
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT_SCAN }}

      - name: Gitleaks — scan working tree
        uses: gitleaks/gitleaks-action@v3
        env:
          # Built-in token + the job's pull-requests:read grant above — no PAT needed
          # for gitleaks' PR-commits API call (the previous GH_PAT_SCAN 404'd it).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────
  # CI gate — the ONLY check branch-protection should require.
  #
  # Every conditional job above is path-filtered: when its paths don't
  # change the job is skipped and GitHub never reports a status for it.
  # A branch-protection rule that requires a skipped check blocks the PR
  # forever. This gate job always runs, aggregates every upstream result,
  # and fails only when an upstream job truly failed or was cancelled.
  # Skipped jobs are treated as passing (no relevant paths changed).
  # ──────────────────────────────────────────────────────────────────────
  homelab-render:
    name: Homelab release .env + render check
    needs: changes
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'homelab') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build and render staging/production, override, mTLS and broken-render cases
        run: bash scripts/homelab-render.test.sh

  sops-secrets:
    name: SOPS deploy-secret tooling + workflow static rules
    needs: changes
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'sops') ||
      contains(fromJson(needs.changes.outputs.matched), 'homelab') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-sops

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: All test groups (resolve, build, render, static workflow rules, AC-24)
        run: bash scripts/sops-secrets.test.sh

  config-wiring:
    name: Config key wiring (whole-tree)
    needs: changes
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'config-wiring') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Config-wiring checker tests
        run: node --test scripts/config-wiring.test.mjs

      - name: Seeded keys and reads join against the committed baseline
        run: node scripts/check-config-wiring.mjs --final

      - name: Config-key convention docs state the rule (C-05, CONFIG-9, config-governance)
        run: node scripts/check-config-wiring.mjs --doc-check

      - name: Config watcher core copies are byte-identical
        run: python3 scripts/check-watcher-copies.py

  # Regenerates scripts/config-wiring-stored.json from the config migrations on a scratch DB; the
  # committed copy must match, because check-config-wiring.mjs reads it instead of a database.
  config-wiring-stored:
    name: Config stored-set freshness
    needs: changes
    if: >-
      contains(fromJson(needs.changes.outputs.matched), 'config-wiring-stored') ||
      contains(fromJson(needs.changes.outputs.matched), 'ci')
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: xstockstrat
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: xstockstrat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xstockstrat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Build migrator image (migrate + psql + envsubst)
        run: docker build -f scripts/Dockerfile.migrate -t xstockstrat-migrate-ci .

      - name: Regenerate the stored set
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="postgres://xstockstrat:ci-only@localhost:5432/xstockstrat?sslmode=disable" \
            -v "$PWD:/repo" -w /repo --entrypoint bash \
            xstockstrat-migrate-ci scripts/config-wiring-stored.sh

      - name: Fresh 041 dry-run matches the committed report
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="postgres://xstockstrat:ci-only@localhost:5432/xstockstrat?sslmode=disable" \
            -v "$PWD:/repo" -w /repo --entrypoint bash \
            xstockstrat-migrate-ci scripts/config-heal-dryrun.sh --fresh
          git diff --exit-code scripts/config-heal/dryrun-fresh.tsv

      - name: Committed stored set is fresh
        run: git diff --exit-code scripts/config-wiring-stored.json

      - name: Upload the regenerated stored set and fresh dry-run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: config-wiring-stored
          path: |
            scripts/config-wiring-stored.json
            scripts/config-heal/dryrun-fresh.tsv

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - proto-lint
      - proto-freshness
      - go-lint
      - python-lint
      - python-test
      - node-lint
      - node-test
      - frontend-e2e
      - dockerfile-lint
      - shell-lint
      - shell-freeze
      - scripts-python
      - migration-rerun
      - migration-contract-gate
      - ledger-db-test
      - portfolio-db-test
      - homelab-render
      - sops-secrets
      - markdown-lint
      - context-map
      - otel-signals
      - ledger-guard
      - secret-scan
      - config-wiring
      - config-wiring-stored
      - frontend-e2e-production
      - ui-prod-image-build
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate upstream results
        run: |
          echo "proto-lint:      ${{ needs.proto-lint.result }}"
          echo "proto-freshness: ${{ needs.proto-freshness.result }}"
          echo "go-lint:         ${{ needs.go-lint.result }}"
          echo "python-lint:     ${{ needs.python-lint.result }}"
          echo "python-test:     ${{ needs.python-test.result }}"
          echo "node-lint:       ${{ needs.node-lint.result }}"
          echo "node-test:       ${{ needs.node-test.result }}"
          echo "frontend-e2e:    ${{ needs.frontend-e2e.result }}"
          echo "dockerfile-lint: ${{ needs.dockerfile-lint.result }}"
          echo "shell-lint:      ${{ needs.shell-lint.result }}"
          echo "shell-freeze:    ${{ needs.shell-freeze.result }}"
          echo "scripts-python:  ${{ needs.scripts-python.result }}"
          echo "migration-rerun: ${{ needs.migration-rerun.result }}"
          echo "migration-contract-gate: ${{ needs.migration-contract-gate.result }}"
          echo "ledger-db-test:  ${{ needs.ledger-db-test.result }}"
          echo "portfolio-db-test: ${{ needs.portfolio-db-test.result }}"
          echo "homelab-render:  ${{ needs.homelab-render.result }}"
          echo "sops-secrets:    ${{ needs.sops-secrets.result }}"
          echo "markdown-lint:   ${{ needs.markdown-lint.result }}"
          echo "context-map:     ${{ needs.context-map.result }}"
          echo "otel-signals:    ${{ needs.otel-signals.result }}"
          echo "ledger-guard:    ${{ needs.ledger-guard.result }}"
          echo "secret-scan:     ${{ needs.secret-scan.result }}"
          echo "config-wiring:   ${{ needs.config-wiring.result }}"
          echo "config-wiring-stored: ${{ needs.config-wiring-stored.result }}"
          echo "frontend-e2e-production: ${{ needs.frontend-e2e-production.result }}"
          echo "ui-prod-image-build: ${{ needs.ui-prod-image-build.result }}"

      - name: Fail on upstream failure or cancellation
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::One or more CI jobs failed or were cancelled — see above for per-job status"
          exit 1

      - name: All checks passed
        run: echo "All CI jobs passed or were skipped (no relevant paths changed)"
