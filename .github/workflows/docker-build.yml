name: Docker build and push (reusable)

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Short SHA tag for images'
        required: true
        type: string
      latest_tag:
        description: 'Floating tag (latest-dev or latest)'
        required: true
        type: string
      build_migrator:
        description: 'Also build xstockstrat-db-migrator (only the homelab deploy pulls it)'
        required: false
        type: boolean
        default: false
      ui_theme:
        description: 'UI build theme baked into xstockstrat-ui (staging or production)'
        required: true
        type: string

jobs:
  preflight-ui-theme:
    name: Preflight — refuse to re-theme an existing UI tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Validate ui_theme
        env:
          T: ${{ inputs.ui_theme }}
        run: case "$T" in staging|production) ;; *) exit 1;; esac

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to re-theme an existing tag
        env:
          TAG: ${{ inputs.image_tag }}
          T: ${{ inputs.ui_theme }}
        run: bash scripts/ui-theme-label.sh refuse-retheme "$TAG" "$T"

  build:
    name: Build (${{ matrix.service }}) → GHCR
    needs: preflight-ui-theme
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: xstockstrat-trading
            dockerfile: services/xstockstrat-trading/Dockerfile
          - service: xstockstrat-portfolio
            dockerfile: services/xstockstrat-portfolio/Dockerfile
          - service: xstockstrat-marketdata
            dockerfile: services/xstockstrat-marketdata/Dockerfile
          - service: xstockstrat-indicators
            dockerfile: services/xstockstrat-indicators/Dockerfile
          - service: xstockstrat-ingest
            dockerfile: services/xstockstrat-ingest/Dockerfile
          - service: xstockstrat-analysis
            dockerfile: services/xstockstrat-analysis/Dockerfile
          - service: xstockstrat-agent
            dockerfile: services/xstockstrat-agent/Dockerfile
          - service: xstockstrat-ledger
            dockerfile: services/xstockstrat-ledger/Dockerfile
          - service: xstockstrat-config
            dockerfile: services/xstockstrat-config/Dockerfile
          - service: xstockstrat-identity
            dockerfile: services/xstockstrat-identity/Dockerfile
          - service: xstockstrat-notify
            dockerfile: services/xstockstrat-notify/Dockerfile
          - service: xstockstrat-ui
            dockerfile: services/xstockstrat-ui/Dockerfile
          - service: xstockstrat-db-migrator
            dockerfile: scripts/Dockerfile.migrate
    steps:
      - uses: actions/checkout@v7
        if: matrix.service != 'xstockstrat-db-migrator' || inputs.build_migrator

      - name: Set up Docker Buildx
        if: matrix.service != 'xstockstrat-db-migrator' || inputs.build_migrator
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: matrix.service != 'xstockstrat-db-migrator' || inputs.build_migrator
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        if: matrix.service != 'xstockstrat-db-migrator' || inputs.build_migrator
        id: tags
        run: |
          REPO="ghcr.io/davcs86/xstockstrat/${{ matrix.service }}"
          echo "tags=${REPO}:${{ inputs.image_tag }},${REPO}:${{ inputs.latest_tag }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: matrix.service != 'xstockstrat-db-migrator' || inputs.build_migrator
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ matrix.service == 'xstockstrat-ui' && format('UI_THEME={0}', inputs.ui_theme) || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          platforms: linux/amd64
