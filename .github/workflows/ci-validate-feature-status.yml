name: ci-validate-feature-status

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  validate-and-update-feature-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # PAT required to push status-update commits and delete remote branches without
          # hitting protected-branch restrictions and to trigger downstream workflows.
          # Falls back to GITHUB_TOKEN if PAT is not configured.
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify GH_PAT is configured
        run: |
          if [ -z "${{ secrets.GH_PAT }}" ]; then
            echo "::warning::GH_PAT secret is not set — falling back to GITHUB_TOKEN, which cannot push to protected branches. Configure a PAT with repo write access."
          fi

      - name: Check for promotion PR merge and update feature statuses
        run: |
          set -e

          # Get the current commit and the previous one
          CURRENT_SHA=$(git rev-parse HEAD)
          PREVIOUS_SHA=$(git rev-parse HEAD~1)

          # Check if this is a promotion PR merge by looking at the commit message
          COMMIT_MSG=$(git log -1 --pretty=%B $CURRENT_SHA)

          if [[ $COMMIT_MSG =~ release:\ promote\ main-dev\ to\ main ]]; then
            echo "✓ Detected promotion PR merge: $CURRENT_SHA"
            echo "Previous commit: $PREVIOUS_SHA"

            # A promotion PR merges ALL of main-dev into main, so EVERY feature at
            # `code-completed` is — by definition — now in production and must flip to
            # `launched`. Select them by the canonical status.md (single source of truth;
            # single bulk egrep — see docs/roadmap/features/CLAUDE.md § Bulk Status Reads,
            # Case 1).
            #
            # Do NOT filter by matching the feature slug against promotion commit messages.
            # The previous `git log $PREVIOUS_SHA..$CURRENT_SHA --grep="$slug"` filter
            # permanently stranded any feature whose squash-merge message omitted its slug
            # (e.g. "feature(140): daily chart freshness" vs slug "chart-data-freshness"),
            # leaving it stuck at `code-completed` forever. Keying off status.md instead is
            # both correct (promotion carries the whole branch) and self-healing: a feature
            # stranded by an earlier run is picked up on the next promotion. This also
            # matches promote.yml, whose changelog already lists ALL code-completed features
            # as "included in this promotion".
            PROMOTED_FEATURES=()

            while IFS= read -r status_file; do
              [ -z "$status_file" ] && continue
              feature_dir=$(dirname "$status_file")
              PROMOTED_FEATURES+=("$feature_dir")
              echo "  → Promoting feature (code-completed → launched): $(basename "$feature_dir")"
            done < <(egrep -l '^code-completed$' docs/roadmap/features/*/status.md 2>/dev/null)

            # Update each promoted feature's status
            if [ ${#PROMOTED_FEATURES[@]} -gt 0 ]; then
              echo ""
              echo "Updating feature statuses for ${#PROMOTED_FEATURES[@]} promoted feature(s)..."

              TODAY=$(date +%Y-%m-%d)
              PROMOTION_PR=$(echo "$COMMIT_MSG" | sed -E 's/.*\(#([0-9]+)\).*/\1/' | head -1)

              for feature_dir in "${PROMOTED_FEATURES[@]}"; do
                feature_md="$feature_dir/feature.md"
                status_md="$feature_dir/status.md"
                context_md="$feature_dir/context.md"

                echo "  Updating: $feature_md"

                # Overwrite the canonical status file (plain string, no markdown)
                printf '%s\n' "launched" > "$status_md"

                # Add Committed to main field (after Development Branch/Created/Last Updated header)
                if ! grep -q "^\*\*Committed to main\*\*:" "$feature_md"; then
                  sed -i "/^\*\*Last Updated\*\*/a **Committed to main**: $CURRENT_SHA" "$feature_md"
                fi

                # Add Launched date field
                if ! grep -q "^\*\*Launched date\*\*:" "$feature_md"; then
                  sed -i "/^\*\*Committed to main\*\*/a **Launched date**: $TODAY" "$feature_md"
                fi

                # Add to status history — insert before the --- that closes Status History section only
                history_line="| $TODAY | \`code-completed\` → \`launched\` | CI workflow | Promoted via PR #$PROMOTION_PR; committed $CURRENT_SHA |"
                awk -v line="$history_line" '
                  /^## Status History/ { in_history=1 }
                  in_history && /^---$/ && !done { print line; done=1; in_history=0 }
                  { print }
                ' "$feature_md" > /tmp/feat_update.md && mv /tmp/feat_update.md "$feature_md"

                # Update context.md with session log
                {
                  echo ""
                  echo "## Session $TODAY (CI: feature status automation)"
                  echo ""
                  echo "- Promotion PR #$PROMOTION_PR merged to main"
                  echo "- Feature promoted and committed: $CURRENT_SHA"
                  echo "- Status updated: \`code-completed\` → \`launched\`"
                  echo "- Launched date: $TODAY"
                } >> "$context_md"
              done

              # Commit and push changes
              git add docs/roadmap/features/*/feature.md docs/roadmap/features/*/status.md docs/roadmap/features/*/context.md
              git commit -m "chore: auto-update feature statuses for promotion PR #$PROMOTION_PR" || true
              git push

              echo ""
              echo "✓ Feature statuses updated successfully"
            else
              echo "ℹ No code-completed features detected in this promotion PR"
            fi
          else
            echo "ℹ Skipping: Not a promotion PR merge (no 'release: promote' in commit message)"
          fi

      - name: Delete orphan feature branches
        run: |
          set -e

          echo "=== Orphan Feature Branch Cleanup ==="

          # List all remote feature/* and feature-steps/* branches
          REMOTE_BRANCHES=$(git ls-remote --heads origin 'refs/heads/feature/*' 'refs/heads/feature-steps/*' \
            | awk '{print $2}' | sed 's|refs/heads/||')

          if [ -z "$REMOTE_BRANCHES" ]; then
            echo "ℹ No remote feature/* or feature-steps/* branches found"
            exit 0
          fi

          DELETED=0
          SKIPPED=0

          while IFS= read -r branch; do
            [ -z "$branch" ] && continue

            # Derive feature directory slug from branch name
            if [[ "$branch" == feature-steps/* ]]; then
              # feature-steps/<NNN-slug>-step-<N>  →  strip prefix and trailing -step-N
              slug=$(echo "$branch" | sed 's|feature-steps/||' | sed 's/-step-[0-9]*$//')
            else
              # feature/<NNN-slug>  →  strip prefix
              slug=$(echo "$branch" | sed 's|feature/||')
            fi

            # Directories are named NNN-<slug>; try glob match first
            status_md=$(ls "docs/roadmap/features/"*"-${slug}/status.md" 2>/dev/null | head -1)
            if [ -z "$status_md" ]; then
              status_md="docs/roadmap/features/$slug/status.md"
            fi

            if [ ! -f "$status_md" ]; then
              echo "  ⚠ $branch: no status.md for slug '$slug' — skipping"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            status=$(cat "$status_md")

            case "$status" in
              launched|rolled-back|demoted/canceled)
                echo "  → Deleting orphan: $branch (status: $status)"
                git push origin --delete "$branch"
                DELETED=$((DELETED + 1))
                ;;
              *)
                echo "  ✓ Keeping: $branch (status: $status)"
                SKIPPED=$((SKIPPED + 1))
                ;;
            esac
          done <<< "$REMOTE_BRANCHES"

          echo ""
          echo "✓ Cleanup complete: $DELETED deleted, $SKIPPED skipped"
