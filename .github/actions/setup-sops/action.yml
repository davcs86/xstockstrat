# The only home of the sops/age pins: bump the versions and SHA-256 values here, and in scripts/sops-secrets.test.sh.
name: Setup sops + age
description: Install the pinned, checksum-verified sops and age (age, age-keygen) binaries.
runs:
  using: composite
  steps:
    - name: Install sops and age (pinned, checksum-verified)
      shell: bash
      env:
        SOPS_VERSION: "3.13.3"
        SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        AGE_VERSION: "1.3.2"
        AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        curl -fsSLO "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
        echo "${SOPS_SHA256}  sops-v${SOPS_VERSION}.linux.amd64" | sha256sum -c -
        sudo install -m 0755 "sops-v${SOPS_VERSION}.linux.amd64" /usr/local/bin/sops
        curl -fsSLO "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
        echo "${AGE_SHA256}  age-v${AGE_VERSION}-linux-amd64.tar.gz" | sha256sum -c -
        tar xzf "age-v${AGE_VERSION}-linux-amd64.tar.gz"
        sudo install -m 0755 age/age age/age-keygen /usr/local/bin/
        sops --version
        age --version
