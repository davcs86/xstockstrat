version: 2

# `open-pull-requests-limit: 0` disables ROUTINE version-update PRs for every
# ecosystem; `target-branch` applies only to those. SECURITY-update PRs ignore
# both and always target the default branch (main); sync-main-to-maindev.yml
# back-merges them into main-dev, opening a back-merge PR when that conflicts.

updates:
  # Node.js workspace (pnpm) — root lockfile manages all Node/Next services
  - package-ecosystem: npm
    directory: /
    target-branch: main-dev
    schedule:
      interval: daily
    open-pull-requests-limit: 0

  # Python services (pip ecosystem covers uv lockfiles)
  - package-ecosystem: pip
    directory: /services/xstockstrat-indicators
    target-branch: main-dev
    schedule:
      interval: daily
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directory: /services/xstockstrat-ingest
    target-branch: main-dev
    schedule:
      interval: daily
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directory: /services/xstockstrat-analysis
    target-branch: main-dev
    schedule:
      interval: daily
    open-pull-requests-limit: 0

  # Go services
  - package-ecosystem: gomod
    directory: /services/xstockstrat-trading
    target-branch: main-dev
    schedule:
      interval: daily
    open-pull-requests-limit: 0

  - package-ecosystem: gomod
    directory: /services/xstockstrat-marketdata
    target-branch: main-dev
    schedule:
      interval: daily
    open-pull-requests-limit: 0

  - package-ecosystem: gomod
    directory: /services/xstockstrat-portfolio
    target-branch: main-dev
    schedule:
      interval: daily
    open-pull-requests-limit: 0

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    target-branch: main-dev
    schedule:
      interval: daily
    open-pull-requests-limit: 0
