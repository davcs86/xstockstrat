syntax = "proto3";

package xstockstrat.ingest.v1;

option go_package = "github.com/xstockstrat/contracts/gen/go/ingest/v1;ingestv1";

import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/field_mask.proto";

service IngestService {
  rpc TriggerBackfill(TriggerBackfillRequest) returns (TriggerBackfillResponse);
  rpc GetBackfillStatus(GetBackfillStatusRequest) returns (BackfillJob);
  rpc ListBackfillJobs(ListBackfillJobsRequest) returns (ListBackfillJobsResponse);
  // Cancel a QUEUED/RUNNING backfill job; returns the updated job (CANCELED). Completed-chunk bars are retained (FR-4).
  rpc CancelBackfill(CancelBackfillRequest) returns (BackfillJob);
  rpc NormalizeRawData(NormalizeRawDataRequest) returns (NormalizeRawDataResponse);
  // Signal ingestion — persists newsletter/external signals to ingest.newsletter_signals hypertable
  rpc IngestSignal(IngestSignalRequest) returns (IngestSignalResponse);
  // Signal query — returns active signals filtered by source/symbol/direction and time window
  rpc QuerySignals(QuerySignalsRequest) returns (QuerySignalsResponse);
  rpc ListSignalSources(ListSignalSourcesRequest) returns (ListSignalSourcesResponse);
  rpc ManageSignalSource(ManageSignalSourceRequest) returns (ManageSignalSourceResponse);
}

message BackfillJob {
  string job_id = 1;
  repeated string symbols = 2;
  // DEPRECATED: use timeframe_enum. Removed in a future release once all callers migrate.
  string timeframe = 3 [deprecated = true];
  xstockstrat.common.v1.TimeRange range = 4;
  BackfillStatus status = 5;
  int64 bars_processed = 6;
  int64 bars_total = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp completed_at = 9;
  string error = 10;
  repeated string failed_symbols = 11; // symbols that failed in a PARTIAL/FAILED job (FR-7)
  xstockstrat.common.v1.Timeframe timeframe_enum = 12;
  int32 chunks_total = 13;      // planned chunk count (FR-5)
  int32 chunks_completed = 14;  // chunks in COMPLETED state (FR-5)
}

enum BackfillStatus {
  BACKFILL_STATUS_UNSPECIFIED = 0;
  BACKFILL_STATUS_QUEUED = 1;
  BACKFILL_STATUS_RUNNING = 2;
  BACKFILL_STATUS_COMPLETED = 3;
  BACKFILL_STATUS_FAILED = 4;
  BACKFILL_STATUS_PARTIAL = 5;
  BACKFILL_STATUS_CANCELED = 6;  // operator-canceled (FR-4); completed-chunk bars retained
}

// FillMode selects how much of the requested range a backfill fetches (feature 054, FR-4).
enum FillMode {
  FILL_MODE_UNSPECIFIED = 0;  // treated as FILL_MODE_FULL by the server
  FILL_MODE_FULL = 1;         // fetch the entire requested range (current behavior)
  FILL_MODE_GAPS_ONLY = 2;    // fetch only ranges missing per GetDataCoverage
}

message TriggerBackfillRequest {
  repeated string symbols = 1;
  // DEPRECATED: use timeframe_enum. Removed in a future release once all callers migrate.
  string timeframe = 2 [deprecated = true];
  xstockstrat.common.v1.TimeRange range = 3;
  bool overwrite = 4;
  xstockstrat.common.v1.Timeframe timeframe_enum = 5;
  FillMode fill_mode = 6;  // FR-4; UNSPECIFIED == FULL. Independent of `overwrite`.
}

message TriggerBackfillResponse {
  string job_id = 1;
  BackfillStatus status = 2;
}

message GetBackfillStatusRequest { string job_id = 1; }

message ListBackfillJobsRequest {
  BackfillStatus status_filter = 1;
  xstockstrat.common.v1.PageRequest page = 2;
  string symbol = 3;  // optional ticker filter (FR-3); empty = no narrowing
}

message CancelBackfillRequest {
  string job_id = 1;
}

message ListBackfillJobsResponse {
  repeated BackfillJob jobs = 1;
  xstockstrat.common.v1.PageResponse page = 2;
}

message NormalizeRawDataRequest {
  string source = 1;
  bytes raw_data = 2;
  string format = 3; // "csv", "json", "alpaca_v2"
}

message NormalizeRawDataResponse {
  int64 rows_normalized = 1;
  repeated string errors = 2;
}

// ExternalSignal represents a newsletter or signal-source trade recommendation.
message ExternalSignal {
  string source     = 1;  // "unusual_whales" | "marketwatch" | "dividendology" | "pure_power_picks" | "simply_wall_st"
  string symbol     = 2;  // ticker (e.g. "AAPL")
  string direction  = 3;  // "buy" | "sell" | "hold" | "watchlist"
  double conviction = 4;  // 0.0 – 1.0 confidence (0.0 if not provided by source)
  google.protobuf.Timestamp valid_from  = 5;
  google.protobuf.Timestamp valid_until = 6;  // omit for open-ended
  string headline   = 7;
  string raw_url    = 8;
  repeated string tags = 9;
}

message IngestSignalRequest  { ExternalSignal signal = 1; }
message IngestSignalResponse {
  int64 signal_id = 1;
  // True when this submission matched an existing signal within the dedup window
  // (ingest.signals.dedup_window_hours) on (source, symbol, direction, conviction,
  // valid_until); signal_id is then the EXISTING signal's id, not a newly-inserted one.
  bool deduplicated = 2;
}

message QuerySignalsRequest {
  string source    = 1;  // optional filter
  string symbol    = 2;  // optional filter
  string direction = 3;  // optional filter
  xstockstrat.common.v1.TimeRange active_window = 4;  // signals valid within this range
  xstockstrat.common.v1.PageRequest page = 5;
}

message QuerySignalsResponse {
  repeated ExternalSignal signals = 1;
  xstockstrat.common.v1.PageResponse page = 2;
}

// SignalSource represents a registered signal source entry.
// credentials_ref is intentionally absent — use has_credentials on read.
message SignalSource {
  string slug              = 1;
  string display_name      = 2;
  string source_type       = 3;
  string extractor_module  = 4;
  bool   active            = 5;
  bool   has_credentials   = 6;
  google.protobuf.Struct config_json = 7;
  // ── Source-health fields (feature 083 — Engine → Signal sources) ─────────────
  // health is derived from last_seen_at freshness vs a staleness threshold.
  SourceHealthStatus health = 8;
  google.protobuf.Timestamp last_seen_at = 9;
  string last_error = 10;
  int64  signals_fed = 11;
}

// Health of a registered signal source (feature 083). Closed set → enum (C-04).
enum SourceHealthStatus {
  SOURCE_HEALTH_STATUS_UNSPECIFIED = 0;
  SOURCE_HEALTH_STATUS_LIVE = 1;   // fed within the freshness window
  SOURCE_HEALTH_STATUS_STALE = 2;  // last-seen beyond freshness, within the down threshold
  SOURCE_HEALTH_STATUS_DOWN = 3;   // no signal beyond the down threshold, or last op errored
}

message ListSignalSourcesRequest {
  bool include_inactive = 1;
}

message ListSignalSourcesResponse {
  repeated SignalSource sources = 1;
}

// Closed verb set for ManageSignalSource (feature 088). Closed set → enum (C-04).
enum SignalSourceOperation {
  SIGNAL_SOURCE_OPERATION_UNSPECIFIED = 0;
  SIGNAL_SOURCE_OPERATION_REGISTER = 1;    // strict create: ALREADY_EXISTS on an existing slug
  SIGNAL_SOURCE_OPERATION_UPDATE = 2;      // NOT_FOUND if missing; AIP-161 partial merge via update_mask
  SIGNAL_SOURCE_OPERATION_REACTIVATE = 3;  // set active=TRUE; decoupled from update (RC-6)
  SIGNAL_SOURCE_OPERATION_DEACTIVATE = 4;  // set active=FALSE
}

// ManageSignalSourceRequest verbs (feature 088): prefer operation_enum; the string operation is kept
// for back-compat and read only when operation_enum is UNSPECIFIED.
// credentials_ref is processed on register/update; ignored on reactivate/deactivate. On a masked
// update it is a virtual mask path: listed → apply (empty clears); unlisted → the stored ref is kept.
message ManageSignalSourceRequest {
  SignalSource source         = 1;
  string       credentials_ref = 2;
  string       operation      = 3 [deprecated = true];  // use operation_enum (feature 088)
  // AIP-161 partial update (feature 088). Applies to UPDATE only; absent = full replace (back-compat).
  google.protobuf.FieldMask update_mask = 4;
  // Preferred verb selector (feature 088); when set (!= UNSPECIFIED) it wins over the string operation.
  SignalSourceOperation operation_enum = 5;
}

message ManageSignalSourceResponse {
  SignalSource source = 1;
}
