syntax = "proto3";

package xstockstrat.identity.v1;

option go_package = "github.com/xstockstrat/contracts/gen/go/identity/v1;identityv1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service IdentityService {
  rpc AuthenticateUser(AuthenticateUserRequest) returns (AuthTokenResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (TokenClaims);
  rpc RefreshToken(RefreshTokenRequest) returns (AuthTokenResponse);
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);

  // OAuth 2.1 authorization-server backend (feature 049 Part B). The MCP agent is the
  // OAuth AS/RS HTTP facade; identity is the durable client/code store + token mint.
  rpc RegisterOAuthClient(RegisterOAuthClientRequest) returns (OAuthClient);
  rpc GetOAuthClient(GetOAuthClientRequest) returns (OAuthClient);
  rpc IssueAuthCode(IssueAuthCodeRequest) returns (IssueAuthCodeResponse);
  rpc ExchangeAuthCode(ExchangeAuthCodeRequest) returns (OAuthTokenResponse);
  rpc RefreshOAuthToken(RefreshOAuthTokenRequest) returns (OAuthTokenResponse);

  // Per-user authorized-app management (feature 051) — list/revoke OAuth clients the
  // calling user has granted access to the MCP agent. Additive over 049's OAuth backend.
  rpc ListAuthorizedApps(ListAuthorizedAppsRequest) returns (ListAuthorizedAppsResponse);
  rpc RevokeAuthorizedApp(RevokeAuthorizedAppRequest) returns (RevokeAuthorizedAppResponse);

  // User profile metadata self-management (feature 130)
  rpc GetUserMetadata(GetUserMetadataRequest) returns (GetUserMetadataResponse);
  rpc UpdateUserMetadata(UpdateUserMetadataRequest) returns (UpdateUserMetadataResponse);

  // User management (admin-gated, feature 043). Every RPC requires the admin access-scope bit;
  // passwords are write-only (never returned). Additive over the existing service.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc UpdatePassword(UpdatePasswordRequest) returns (UpdatePasswordResponse);
  rpc SetUserRoles(SetUserRolesRequest) returns (SetUserRolesResponse);
  rpc SetUserActive(SetUserActiveRequest) returns (SetUserActiveResponse);
}

message AuthenticateUserRequest {
  string email = 1;
  string password = 2;
}

message AuthTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp expires_at = 3;
  TokenClaims claims = 4;
}

message TokenClaims {
  string user_id = 1;
  string email = 2;
  repeated string roles = 3;
  google.protobuf.Timestamp issued_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  string aud = 6;  // audience / resource URI (OAuth audience-bound JWT, RFC 8707)
}

message ValidateTokenRequest { string token = 1; }
message RefreshTokenRequest { string refresh_token = 1; }
message RevokeTokenRequest { string token = 1; }
message RevokeTokenResponse { bool success = 1; }

// ── OAuth 2.1 messages (feature 049 Part B) ──────────────────────────────────
message OAuthClient {
  string client_id = 1;
  repeated string redirect_uris = 2;
  string client_name = 3;
  google.protobuf.Timestamp created_at = 4;
}

message RegisterOAuthClientRequest {
  repeated string redirect_uris = 1;
  string client_name = 2;
}

message GetOAuthClientRequest { string client_id = 1; }

message IssueAuthCodeRequest {
  string user_id = 1;
  string client_id = 2;
  string redirect_uri = 3;
  string code_challenge = 4;
  string resource = 5;
}

message IssueAuthCodeResponse { string code = 1; }

message ExchangeAuthCodeRequest {
  string code = 1;
  string code_verifier = 2;
  string redirect_uri = 3;
  string client_id = 4;
  string resource = 5;
}

message OAuthTokenResponse {
  string access_token = 1;
  string token_type = 2;
  int64 expires_in = 3;
  string refresh_token = 4;
}

message RefreshOAuthTokenRequest {
  string refresh_token = 1;
  string resource = 2;
}

// ── Authorized-apps management (feature 051) ─────────────────────────────────
message AuthorizedApp {
  string client_id = 1;
  string client_name = 2;
  google.protobuf.Timestamp authorized_at = 3;
  // Best-effort "last refreshed" time (bumped on refresh-token rotation), NOT per-request
  // access. May be unset. The UI labels this "Last refreshed", not "Last used".
  google.protobuf.Timestamp last_used_at = 4;
  repeated string redirect_uris = 5;
}
message ListAuthorizedAppsRequest { string user_id = 1; }
message ListAuthorizedAppsResponse { repeated AuthorizedApp apps = 1; }
message RevokeAuthorizedAppRequest { string user_id = 1; string client_id = 2; }
message RevokeAuthorizedAppResponse { bool success = 1; }

// ── User profile metadata (feature 130) ──────────────────────────────────
message UserMetadata {
  string user_id = 1;
  string email = 2;
  optional string phone = 3;
  optional string display_name = 4;
  google.protobuf.Struct metadata = 5;
  google.protobuf.Timestamp metadata_updated_at = 6;
}
message GetUserMetadataRequest {}
message GetUserMetadataResponse { UserMetadata user_metadata = 1; }
message UpdateUserMetadataRequest {
  optional string phone = 1;
  optional string display_name = 2;
  optional google.protobuf.Struct metadata = 3;
}
message UpdateUserMetadataResponse { UserMetadata user_metadata = 1; }

// ── User management (admin-gated, feature 043) ───────────────────────────────
// Closed role set (C-04). Mirrors the viewer/trader/admin roles the platform already uses;
// TokenClaims.roles stays a free-string list (JWT claim shape, unchanged).
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_ADMIN = 1;
  ROLE_TRADER = 2;
  ROLE_VIEWER = 3;
}

// Password-free admin view of a user (no password / password_hash — FR-10/AC-10).
message User {
  string user_id = 1;
  string email = 2;
  repeated Role roles = 3;
  bool is_active = 4;
  google.protobuf.Timestamp created_at = 5;
}

message CreateUserRequest {
  string email = 1;
  string password = 2;       // write-only; never echoed back
  repeated Role roles = 3;
}
message CreateUserResponse { User user = 1; }

message ListUsersRequest {}
message ListUsersResponse { repeated User users = 1; }

message GetUserRequest { string user_id = 1; }
message GetUserResponse { User user = 1; }

message UpdatePasswordRequest {
  string user_id = 1;
  string new_password = 2;   // write-only; never echoed back
}
message UpdatePasswordResponse {}  // empty — no password/hash returned (AC-10)

message SetUserRolesRequest {
  string user_id = 1;
  repeated Role roles = 2;
}
message SetUserRolesResponse { User user = 1; }

message SetUserActiveRequest {
  string user_id = 1;
  bool active = 2;
}
message SetUserActiveResponse { User user = 1; }
