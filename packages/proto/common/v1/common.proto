syntax = "proto3";

package xstockstrat.common.v1;

option go_package = "github.com/xstockstrat/contracts/gen/go/common/v1;commonv1";

import "google/protobuf/timestamp.proto";

// Pagination
message PageRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message PageResponse {
  string next_page_token = 1;
  int32 total_count = 2;
}

// Standard error envelope
message Error {
  string code = 1;
  string message = 2;
  map<string, string> details = 3;
}

// Money / decimal representation
message Decimal {
  int64 units = 1;       // integer part
  int32 nanos = 2;       // fractional part (0..999_999_999)
  string currency = 3;   // ISO 4217
}

// Asset identifier
message Asset {
  string symbol = 1;
  string exchange = 2;
  string asset_class = 3; // equity, crypto, option
}

// Time range
message TimeRange {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
}

// TradingMode distinguishes paper (simulated) from live (real-money) order routing.
// Used by both xstockstrat-trading and xstockstrat-portfolio.
enum TradingMode {
  TRADING_MODE_UNSPECIFIED = 0;
  TRADING_MODE_PAPER = 1;
  TRADING_MODE_LIVE = 2;
}

// Environment distinguishes deployment environments; used by xstockstrat-config to scope config
// values. The platform's two environments are STAGING and PRODUCTION (feature 147). paper/live
// trading mode is DERIVED from the environment (production=live, staging=paper), not a separate
// config dimension. ENVIRONMENT_DEV is deprecated in favor of ENVIRONMENT_STAGING but retained for
// wire compatibility; the config server treats DEV and STAGING as the same 'staging' scope.
enum Environment {
  ENVIRONMENT_UNSPECIFIED = 0;
  ENVIRONMENT_DEV = 1 [deprecated = true]; // deprecated: use ENVIRONMENT_STAGING (feature 147)
  ENVIRONMENT_PRODUCTION = 2;
  ENVIRONMENT_STAGING = 3;
}

// BrokerType identifies the broker for a registered account.
enum BrokerType {
  BROKER_TYPE_UNSPECIFIED = 0;
  BROKER_TYPE_ALPACA = 1;
  BROKER_TYPE_IBKR = 2;
}

// Timeframe is the canonical OHLCV bar interval, shared by marketdata + analysis + ingest.
// Replaces the free-text "1d"/"1Day"/"1m" strings that previously mismatched across services.
//
// Only TIMEFRAME_1DAY is requestable (feature 143) — GetBars/BackfillBars reject anything
// else. TIMEFRAME_15MIN/TIMEFRAME_1HOUR are deprecated but retained (not deleted, not
// renumbered) for wire compatibility with historically-stored 15m/1h rows, mirroring how
// TIMEFRAME_1MIN/TIMEFRAME_5MIN were already handled when sub-15m intervals stopped being
// selectable.
enum Timeframe {
  TIMEFRAME_UNSPECIFIED = 0;
  TIMEFRAME_15MIN = 5 [deprecated = true]; // deprecated: only 1d is requestable (feature 143)
  TIMEFRAME_1HOUR = 3 [deprecated = true]; // deprecated: only 1d is requestable (feature 143)
  TIMEFRAME_1DAY = 4;
  TIMEFRAME_1MIN = 1 [deprecated = true]; // deprecated: sub-15m intervals removed from the product
  TIMEFRAME_5MIN = 2 [deprecated = true]; // deprecated: sub-15m intervals removed from the product
}
