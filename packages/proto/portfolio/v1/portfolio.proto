syntax = "proto3";

package xstockstrat.portfolio.v1;

option go_package = "github.com/xstockstrat/contracts/gen/go/portfolio/v1;portfoliov1";

import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";

service PortfolioService {
  rpc GetPortfolio(GetPortfolioRequest) returns (Portfolio);
  rpc GetPosition(GetPositionRequest) returns (Position);
  rpc ListPositions(ListPositionsRequest) returns (ListPositionsResponse);
  rpc GetPnL(GetPnLRequest) returns (PnLResponse);
  rpc GetSnapshot(GetSnapshotRequest) returns (PortfolioSnapshot);
  rpc StreamPortfolioUpdates(StreamPortfolioUpdatesRequest) returns (stream PortfolioSnapshot);
  rpc ListPortfolios (ListPortfoliosRequest) returns (ListPortfoliosResponse);
  // Watchlist management (feature 058). Additive — ownership is taken from the
  // propagated x-user-id header server-side, never from request fields.
  rpc CreateWatchlist(CreateWatchlistRequest) returns (CreateWatchlistResponse);
  rpc GetWatchlist(GetWatchlistRequest) returns (GetWatchlistResponse);
  rpc ListWatchlists(ListWatchlistsRequest) returns (ListWatchlistsResponse);
  rpc UpdateWatchlist(UpdateWatchlistRequest) returns (UpdateWatchlistResponse);
  rpc DeleteWatchlist(DeleteWatchlistRequest) returns (DeleteWatchlistResponse);
  rpc AddWatchlistSymbols(AddWatchlistSymbolsRequest) returns (AddWatchlistSymbolsResponse);
  rpc RemoveWatchlistSymbols(RemoveWatchlistSymbolsRequest) returns (RemoveWatchlistSymbolsResponse);
  // Find-or-create the caller's system_managed=true watchlist (feature 127).
  // Ownership is taken from the propagated x-user-id header; the request has no body (FR-2).
  rpc EnsureSignalWatchlist(EnsureSignalWatchlistRequest) returns (EnsureSignalWatchlistResponse);
  // Cross-user enumeration (feature 154): the distinct union of watchlist symbols across
  // ALL users' watchlists — NOT scoped to the caller's x-user-id. Privileged: gated by the
  // x-internal-caller allow-list (grant `analysis-fundsignal`), not the admin x-access-scope
  // bit (PR #994) — a non-allow-listed caller gets PERMISSION_DENIED. Read-only; intended for
  // the fundamentals-signal producer's universe resolution.
  rpc ListAllWatchlistSymbols(ListAllWatchlistSymbolsRequest) returns (ListAllWatchlistSymbolsResponse);
}

message Portfolio {
  string portfolio_id = 1;
  string user_id = 2;
  double equity = 3;
  double cash = 4;
  double buying_power = 5;
  double day_pnl = 6;
  double day_pnl_pct = 7;
  double total_pnl = 8;
  google.protobuf.Timestamp updated_at = 9;
  repeated Position positions = 10;
  string account_id = 11;
  // realized_pnl is the account-grain cumulative realized P&L. Set only for OFFLINE accounts
  // (feature 157); `optional` for proto3 explicit presence so an offline account's genuine $0
  // is distinguishable from a broker account's unset. Broker cards leave it unset.
  optional double realized_pnl = 12;
}

message Position {
  string symbol = 1;
  double qty = 2;
  double avg_entry_price = 3;
  double current_price = 4;
  double market_value = 5;
  double unrealized_pnl = 6;
  double unrealized_pnl_pct = 7;
  double cost_basis = 8;
  google.protobuf.Timestamp opened_at = 9;
  xstockstrat.common.v1.TradingMode trading_mode = 10;
  string account_id = 11;
  // Today's (intraday) P&L — change since the previous trading day's close.
  // Sourced from the broker's per-position intraday valuation (Alpaca
  // unrealized_intraday_pl / unrealized_intraday_plpc) on account.positions.synced.
  // Zero when the broker does not report an intraday figure (e.g. order-fill-only
  // positions enriched from marketdata mid-quotes); distinct from unrealized_pnl,
  // which is total P&L since entry.
  double day_pnl = 12;       // dollars
  double day_pnl_pct = 13;   // fraction (e.g. 0.0125 = +1.25%)
  // ── Risk / factor fields (feature 083 — Book → Exposure) ─────────────────────
  // Resting-stop price learned from trading's order events via the ledger (no
  // portfolio→trading synchronous edge; held in-memory, rebuilt on boot-replay).
  // risk_at_stop / stop_distance_pct are computed on read off the broker-authoritative
  // current_price: stop_distance_pct = (current_price − stop_price) / current_price.
  double stop_price = 14;
  double risk_at_stop = 15;
  double stop_distance_pct = 16;
  // factor grouping from the portfolio.exposure.factor_map config key (marketdata
  // exposes no sector); "" → UI groups as "Unclassified".
  string factor = 17;
  PositionRiskFlag flag = 18;
  string exit_rule = 19;
  // Broker order IDs for the resting protective bracket legs (feature 030 —
  // stop-loss-bracket-orders), sourced from trading's order.bracket_updated ledger
  // events. "" when the position has no active bracket (manual entry, bracket
  // disabled, or bracket not yet confirmed ACTIVE).
  string stop_order_id = 20;
  string take_profit_order_id = 21;
}

// A risk cue surfaced on the Exposure surface (feature 083). Closed set → enum (C-04).
enum PositionRiskFlag {
  POSITION_RISK_FLAG_UNSPECIFIED = 0;
  POSITION_RISK_FLAG_ADD_SIGNAL = 1;     // a buy signal is live for this held symbol
  POSITION_RISK_FLAG_REDUCE_SIGNAL = 2;  // a sell signal is live for this held symbol
  POSITION_RISK_FLAG_STOP_NEAR = 3;      // stop-distance within the near threshold
}

// PositionSide distinguishes a long (qty > 0) from a short (qty < 0) position.
// Used only as an additive filter on ListPositionsRequest; the Position message itself
// continues to carry signed qty.
enum PositionSide {
  POSITION_SIDE_UNSPECIFIED = 0; // no side filter — return both long and short
  POSITION_SIDE_LONG = 1;        // qty > 0
  POSITION_SIDE_SHORT = 2;       // qty < 0
}

message PortfolioSnapshot {
  string portfolio_id = 1;
  google.protobuf.Timestamp snapshot_time = 2;
  double equity = 3;
  double cash = 4;
  double day_pnl = 5;
  int32 open_positions = 6;
  xstockstrat.common.v1.TradingMode trading_mode = 7;
  string account_id = 8;
}

message PnLResponse {
  double realized_pnl = 1;
  double unrealized_pnl = 2;
  double total_pnl = 3;
  double day_pnl = 4;
  xstockstrat.common.v1.TimeRange range = 5;
}

// If trading_mode is UNSPECIFIED, returns positions for all modes.
message GetPortfolioRequest {
  string user_id = 1;
  xstockstrat.common.v1.TradingMode trading_mode = 2;
  optional string account_id = 3;
}
message GetPositionRequest {
  string user_id = 1;
  string symbol = 2;
  xstockstrat.common.v1.TradingMode trading_mode = 3;
  optional string account_id = 4;
}
message ListPositionsRequest {
  string user_id = 1;
  xstockstrat.common.v1.PageRequest page = 2;
  // Filter by trading mode; UNSPECIFIED returns all positions.
  xstockstrat.common.v1.TradingMode trading_mode = 3;
  optional string account_id = 4;
  // Additive filters (feature 056). Empty symbol / UNSPECIFIED side = no narrowing.
  string symbol = 5;       // exact-match symbol filter; "" = all symbols
  PositionSide side = 6;   // long/short filter derived from qty sign
}
message ListPositionsResponse {
  repeated Position positions = 1;
  xstockstrat.common.v1.PageResponse page = 2;
}
message GetPnLRequest {
  string user_id = 1;
  xstockstrat.common.v1.TimeRange range = 2;
  // Filter by trading mode; UNSPECIFIED returns combined P&L.
  xstockstrat.common.v1.TradingMode trading_mode = 3;
  optional string account_id = 4;
}
message GetSnapshotRequest {
  string portfolio_id = 1;
  google.protobuf.Timestamp at_time = 2;
  optional string account_id = 3;
}
message StreamPortfolioUpdatesRequest {
  string user_id = 1;
  // Filter by trading mode; UNSPECIFIED streams all modes.
  xstockstrat.common.v1.TradingMode trading_mode = 2;
  optional string account_id = 3;
}

message ListPortfoliosRequest {
  optional string account_id = 1;
}

message ListPortfoliosResponse {
  repeated Portfolio portfolios = 1;
}

// Provenance of a watchlist entry (feature 127). Consumers default UNSPECIFIED→MANUAL.
enum WatchlistEntrySource {
  WATCHLIST_ENTRY_SOURCE_UNSPECIFIED = 0;
  WATCHLIST_ENTRY_SOURCE_MANUAL = 1;
  WATCHLIST_ENTRY_SOURCE_SIGNAL = 2;
}

// A (symbol, strategy) binding — a ready-made Universe candidate (feature 097).
message WatchlistBinding {
  string symbol = 1;
  string strategy_id = 2;  // "" = unbound (kept as a bare watched symbol)
  // Entry provenance (feature 127); first-writer-wins under ON CONFLICT DO NOTHING.
  // Unspecified on read → treat as MANUAL.
  WatchlistEntrySource source = 3;
}

// Watchlist (feature 058) — a mode-agnostic, user-owned named set of symbols.
message Watchlist {
  string watchlist_id = 1;
  string user_id = 2;
  string name = 3;
  string description = 4;
  // DEPRECATED (feature 097): the flat mirror of `bindings`, kept readable for old clients (FR-6).
  repeated string symbols = 5 [deprecated = true];
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // Authoritative (symbol, strategy) shape (feature 097); when present it supersedes `symbols`.
  repeated WatchlistBinding bindings = 8;
  // System-managed signals watchlist (feature 127), identified by this flag (not by name).
  // Delete-protected (FR-7/FR-8); one per user.
  bool system_managed = 9;
}

// user_id is intentionally absent from all request messages — ownership is taken
// from the propagated x-user-id header server-side (FR-2), never from the wire.
message CreateWatchlistRequest {
  string name = 1;
  string description = 2;
  repeated string symbols = 3;
  // When present, authoritative (feature 097); legacy `symbols` remains accepted (unbound).
  repeated WatchlistBinding bindings = 4;
}
message CreateWatchlistResponse {
  Watchlist watchlist = 1;
}

message GetWatchlistRequest {
  string watchlist_id = 1;
}
message GetWatchlistResponse {
  Watchlist watchlist = 1;
}

message ListWatchlistsRequest {
  xstockstrat.common.v1.PageRequest page = 1;
}
message ListWatchlistsResponse {
  repeated Watchlist watchlists = 1;
  xstockstrat.common.v1.PageResponse page = 2;
}

// Replace semantics for name/description/symbols per FR-1.
message UpdateWatchlistRequest {
  string watchlist_id = 1;
  string name = 2;
  string description = 3;
  repeated string symbols = 4;
  // When present, authoritative (feature 097); legacy `symbols` remains accepted (unbound).
  repeated WatchlistBinding bindings = 5;
}
message UpdateWatchlistResponse {
  Watchlist watchlist = 1;
}

message DeleteWatchlistRequest {
  string watchlist_id = 1;
}
message DeleteWatchlistResponse {}

message AddWatchlistSymbolsRequest {
  string watchlist_id = 1;
  repeated string symbols = 2;
  // When present, authoritative (feature 097); legacy `symbols` remains accepted (unbound).
  repeated WatchlistBinding bindings = 3;
}
message AddWatchlistSymbolsResponse {
  Watchlist watchlist = 1;
}

message RemoveWatchlistSymbolsRequest {
  string watchlist_id = 1;
  repeated string symbols = 2;
}
message RemoveWatchlistSymbolsResponse {
  Watchlist watchlist = 1;
}

// user_id intentionally absent — ownership from the x-user-id header (feature 127, FR-2).
message EnsureSignalWatchlistRequest {}
message EnsureSignalWatchlistResponse {
  Watchlist watchlist = 1;
}

// Empty — the enumeration spans all users; ownership/scoping does not apply (feature 154).
message ListAllWatchlistSymbolsRequest {}
message ListAllWatchlistSymbolsResponse {
  // Distinct, sorted bare symbols across all users' watchlists (bindings collapsed).
  repeated string symbols = 1;
}
