syntax = "proto3";

package xstockstrat.ledger.v1;

option go_package = "github.com/xstockstrat/contracts/gen/go/ledger/v1;ledgerv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "common/v1/common.proto";

// LedgerService — append-only event store.
// All services write events here. Events are immutable once written.
service LedgerService {
  rpc AppendEvent(AppendEventRequest) returns (AppendEventResponse);
  rpc QueryEvents(QueryEventsRequest) returns (QueryEventsResponse);
  rpc StreamEvents(StreamEventsRequest) returns (stream LedgerEvent);
  rpc GetEvent(GetEventRequest) returns (LedgerEvent);
  // Export a caller's events over a time window as a server stream of batched pages,
  // ordered by the global monotonic sequence. Scoped to the caller (x-user-id metadata);
  // never returns another user's or a pre-migration NULL-user_id event.
  rpc ExportEvents(ExportEventsRequest) returns (stream ExportEventsResponse);
}

message LedgerEvent {
  string event_id = 1;          // UUID, server-assigned
  string event_type = 2;        // e.g. "order.created", "trade.filled"
  string source_service = 3;    // originating service name
  string correlation_id = 4;    // trace/request correlation
  google.protobuf.Timestamp occurred_at = 5;
  google.protobuf.Timestamp recorded_at = 6; // server write time
  google.protobuf.Struct payload = 7;         // event body (JSON-like)
  map<string, string> metadata = 8;
  int64 sequence = 9;           // GLOBAL monotonic sequence (nextval('ledger.global_sequence')), ordered across all stream_keys
  string stream_key = 10;       // partition key (e.g. "order:uuid")
  string user_id = 11;          // owning user; empty when platform-scoped or a pre-migration row
}

message AppendEventRequest {
  string event_type = 1;
  string source_service = 2;
  string correlation_id = 3;
  string stream_key = 4;
  google.protobuf.Struct payload = 5;
  map<string, string> metadata = 6;
  google.protobuf.Timestamp occurred_at = 7;
  // Optional caller-supplied dedup key. When set, the ledger appends the event at most
  // once for this key: a retried AppendEvent (e.g. after a transient transport failure)
  // returns the originally-stored event instead of inserting a duplicate. Empty = no
  // dedup (every call inserts), preserving the prior behavior.
  string idempotency_key = 8;
  string user_id = 9;           // owning user; falls back to the x-user-id metadata when empty
}

message AppendEventResponse {
  string event_id = 1;
  int64 sequence = 2;
  google.protobuf.Timestamp recorded_at = 3;
}

message QueryEventsRequest {
  string stream_key = 1;        // optional filter
  string event_type = 2;        // optional filter
  string source_service = 3;    // optional filter
  xstockstrat.common.v1.TimeRange time_range = 4;
  xstockstrat.common.v1.PageRequest page = 5;
  int64 from_sequence = 6;      // replay from sequence
}

message QueryEventsResponse {
  repeated LedgerEvent events = 1;
  xstockstrat.common.v1.PageResponse page = 2;
}

message StreamEventsRequest {
  string stream_key = 1;
  string event_type = 2;
  int64 from_sequence = 3;      // 0 = live tail, >0 = replay then tail
}

message GetEventRequest {
  string event_id = 1;
}

message ExportEventsRequest {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
  // Comma-joined subset of event types to include (e.g. "fill,signal,pnl_snapshot,config_change,alert").
  // Empty = all types.
  string event_type = 3;
}

message ExportEventsResponse {
  // One cursor page of events per message (batched — a large export is thousands of
  // messages, not one per row), each page ordered by the global sequence.
  repeated LedgerEvent events = 1;
}
