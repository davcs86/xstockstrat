syntax = "proto3";

package xstockstrat.analysis.v1;

option go_package = "github.com/xstockstrat/contracts/gen/go/analysis/v1;analysisv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/field_mask.proto";
import "common/v1/common.proto";

service AnalysisService {
  rpc RunBacktest(RunBacktestRequest) returns (BacktestResult);
  rpc ScoreStrategy(ScoreStrategyRequest) returns (StrategyScore);
  rpc ListStrategies(ListStrategiesRequest) returns (ListStrategiesResponse);
  rpc GetStrategyReport(GetStrategyReportRequest) returns (StrategyReport);
  // List past backtest runs (summary metrics + earned score) for a strategy, newest first.
  rpc ListBacktests(ListBacktestsRequest) returns (ListBacktestsResponse);
  // Fetch the persisted full result (trades, per-bar equity, diagnostics) of a past run
  // (feature 068). NOT_FOUND when the run has no persisted detail (legacy/evicted/
  // INSUFFICIENT_DATA runs).
  rpc GetBacktest(GetBacktestRequest) returns (BacktestResult);
  rpc ManageStrategy(ManageStrategyRequest) returns (StrategyDefinition);
  rpc GetStrategy(GetStrategyRequest) returns (StrategyDefinition);
  rpc ListStrategyDefinitions(ListStrategyDefinitionsRequest) returns (ListStrategyDefinitionsResponse);
  rpc SetStrategyLive(SetStrategyLiveRequest) returns (SetStrategyLiveResponse);
  // Screen a symbol universe against weighted criteria (feature 060)
  rpc ScreenSymbols(ScreenSymbolsRequest) returns (ScreenSymbolsResponse);
  // Manually trigger the fundamentals signal producer scan (feature 062, admin-scoped)
  rpc RunFundamentalsScan(RunFundamentalsScanRequest) returns (FundamentalsScanSummary);
  // ── Opportunity queue + readiness + per-strategy analytics (feature 083) ─────
  // Ranked opportunity queue for the Decide surface. Aggregates ingest signals,
  // held positions, and the conviction/readiness evaluator (zero new edges).
  rpc ListOpportunities(ListOpportunitiesRequest) returns (ListOpportunitiesResponse);
  // Per-symbol live condition evaluation (traced): passing/soft/failing leaves +
  // distance-to-threshold. Feeds Signal-detail, Watchlist readiness, and the queue.
  rpc EvaluateReadiness(EvaluateReadinessRequest) returns (EvaluateReadinessResponse);
  // Persist a per-user disposition (snooze/dismiss/take) against a server-issued opportunity_key (feature 097).
  rpc SetOpportunityAction(SetOpportunityActionRequest) returns (SetOpportunityActionResponse);
  // Per-strategy analytics (expectancy / hit-rate / max-DD / signals / taken / queue-share).
  rpc GetStrategyAnalytics(GetStrategyAnalyticsRequest) returns (StrategyAnalytics);
  // Per-component historical indicator series for a strategy over a caller-supplied bar window,
  // for the unified Symbol page's overlay panels (feature 125, FR-6). Reuses the analysis
  // evaluator's own _compute_component per declared component in a dedicated handler loop — never
  // the shared evaluate_conditions_traced (which ListOpportunities' exit trace depends on).
  rpc GetIndicatorSeries(GetIndicatorSeriesRequest) returns (GetIndicatorSeriesResponse);
  // Ranked P&L-attribution factors (feature 042): which indicator value-ranges and signals
  // correlate with positive vs negative realized P&L, scoped by symbol/strategy/time window.
  rpc QueryPnLPatterns(QueryPnLPatternsRequest) returns (QueryPnLPatternsResponse);
}

message RunBacktestRequest {
  string strategy_id = 1;
  xstockstrat.common.v1.TimeRange range = 2;
  repeated string symbols = 3;
  double initial_capital = 4;
  google.protobuf.Struct strategy_params = 5;
  // field 6 — resolve definition from DB; legacy strategy_params (field 5) remains supported
  string strategy_id_ref = 6;
  // field 7 — inline definition; takes precedence over strategy_id_ref if both supplied
  StrategyDefinition inline_definition = 7;
  // field 8 — capital-allocation model (feature 150); unset/UNSPECIFIED → legacy serial per-symbol
  // path (no behavior change for existing callers).
  SizingMode sizing_mode = 8;
  // field 9 — fill model (feature 151); unset/UNSPECIFIED → server default (config
  // analysis.backtest.default_fill_model, else legacy same-bar-close). No behavior change for
  // existing callers.
  FillModel fill_model = 9;
}

enum BacktestStatus {
  BACKTEST_STATUS_UNSPECIFIED = 0;
  BACKTEST_STATUS_OK = 1;
  BACKTEST_STATUS_INSUFFICIENT_DATA = 2;
}

// Backtest capital-allocation model (feature 150). Closed set → enum (C-04).
// A completed run records SIZING_MODE_LEGACY or SIZING_MODE_PORTFOLIO (never UNSPECIFIED);
// UNSPECIFIED is a request-side "unset → legacy" default only.
enum SizingMode {
  SIZING_MODE_UNSPECIFIED = 0;  // request default → the legacy serial per-symbol path
  SIZING_MODE_LEGACY = 1;       // serial per-symbol compounding (the aggregate is Π(1+rᵢ)−1)
  SIZING_MODE_PORTFOLIO = 2;    // one shared cash pool, concurrent positions, one equity curve
}

// Which bar/price a backtest fills a signal at (feature 151). Closed set → enum (C-04).
// A completed run records SAME_BAR_CLOSE or NEXT_BAR_OPEN (never UNSPECIFIED); UNSPECIFIED is a
// request/config "not chosen" sentinel the servicer normalizes to SAME_BAR_CLOSE (legacy).
enum FillModel {
  FILL_MODEL_UNSPECIFIED = 0;    // caller/config did not choose → resolves to SAME_BAR_CLOSE (legacy)
  FILL_MODEL_SAME_BAR_CLOSE = 1; // legacy: fill at bar i's close ± slippage (optimistically biased)
  FILL_MODEL_NEXT_BAR_OPEN = 2;  // bias-free: fill a bar-i signal at bar (i+1)'s open ± slippage
}

message CoverageGap {
  string symbol = 1;
  xstockstrat.common.v1.Timeframe timeframe = 2;
  xstockstrat.common.v1.TimeRange requested_range = 3;
  int64 bars_have = 4;
  int64 bars_need = 5;
  // The range a caller should backfill to satisfy this backtest.
  xstockstrat.common.v1.TimeRange gap = 6;
}

// NOTE: this message's wire bytes are persisted verbatim in analysis.backtest_details
// (feature 068, "store what you serve") — renumbering or retyping any field here or in
// BarDiagnostic silently corrupts previously persisted runs. Additive changes only;
// buf breaking guards this on every PR.
message BacktestResult {
  string backtest_id = 1;
  string strategy_id = 2;
  double total_return = 3;
  double annualized_return = 4;
  double sharpe_ratio = 5;
  double max_drawdown = 6;
  double win_rate = 7;
  int32 total_trades = 8;
  double profit_factor = 9;
  google.protobuf.Timestamp completed_at = 10;
  repeated TradeRecord trades = 11;
  BacktestStatus status = 12;
  repeated CoverageGap coverage_gaps = 13; // populated per-symbol when status == INSUFFICIENT_DATA
  repeated SymbolDiagnostics diagnostics = 14; // per-bar debug data for every simulated symbol (feature 064)
  // Effective starting capital the engine seeded the simulation with (the 100k default
  // when the request omitted it) — required to rebuild the equity curve for a
  // historical run (feature 068).
  double initial_capital = 15;
  // Human-readable run warnings surfaced to the user (feature 086), e.g. a strategy referenced a
  // formula that has since been soft-deleted — the run still completed using its last-saved
  // definition. Empty on a clean run.
  repeated string warnings = 16;
  // ── Portfolio sizing (feature 150) ── additive; empty/legacy for pre-150 and legacy-mode runs.
  SizingMode sizing_mode = 17;                       // the mode actually used (never UNSPECIFIED on a completed run)
  repeated PortfolioCapitalSkip capital_skips = 18;  // portfolio mode only; empty in legacy
  // Portfolio-level daily equity curve (cash + Σ marked-to-market positions), portfolio mode only.
  // NOTE: per-symbol BarDiagnostic.equity (field 15 there) stays per-symbol in portfolio mode — the
  // portfolio contribution lives ONLY here; do not read per-symbol equity as portfolio contribution.
  repeated EquityPoint portfolio_equity_curve = 19;
  // Effective fill model the run actually used (feature 151); never UNSPECIFIED on a completed run.
  FillModel fill_model = 20;
}

// One entry that portfolio mode could not open because the shared pool was fully committed
// at the policy weight (feature 150, FR-5). Emitted instead of a silent zero-sized fill.
message PortfolioCapitalSkip {
  string symbol = 1;
  google.protobuf.Timestamp timestamp = 2;
  double intended_weight = 3;   // position_weight × initial_capital the entry would have needed
  double available_cash = 4;    // cash on hand in the shared pool at that bar
}

// One point of the portfolio-level daily equity curve (cash + Σ marked-to-market positions).
message EquityPoint {
  google.protobuf.Timestamp timestamp = 1;
  double equity = 2;
}

message TradeRecord {
  string symbol = 1;
  string side = 2;
  double qty = 3;
  double entry_price = 4;
  double exit_price = 5;
  double pnl = 6;
  google.protobuf.Timestamp entry_time = 7;
  google.protobuf.Timestamp exit_time = 8;
}

// ── Backtest per-bar diagnostics (feature 064-backtest-debug-info) ────────────

// The engine's decision for a single bar. Closed set → enum (C-04).
enum BarAction {
  BAR_ACTION_UNSPECIFIED = 0;
  BAR_ACTION_WARMUP = 1;      // bar within the strategy's warm-up window
  BAR_ACTION_HOLD_FLAT = 2;   // flat, no entry this bar
  BAR_ACTION_ENTER_LONG = 3;  // opened a long position this bar
  BAR_ACTION_EXIT_LONG = 4;   // closed a long position this bar
  BAR_ACTION_HOLD_LONG = 5;   // holding an existing long, no exit this bar
}

// Why a symbol produced zero trades. Closed set → enum (C-04).
enum NoTradeReason {
  NO_TRADE_REASON_UNSPECIFIED = 0;          // symbol traded, or not classified
  NO_TRADE_REASON_ENTIRE_RANGE_WARMUP = 1;  // the whole range was warm-up
  NO_TRADE_REASON_ENTRY_NEVER_TRUE = 2;     // entry condition never satisfied
  NO_TRADE_REASON_INSUFFICIENT_CAPITAL = 3; // reserved; not emitted this version
  NO_TRADE_REASON_FORMULA_ERROR = 4;        // a custom-formula component failed to execute / returned an out-of-contract series
}

// One row of day-by-day backtest diagnostics for a single bar.
message BarDiagnostic {
  string symbol = 1;
  int32 bar_index = 2;
  google.protobuf.Timestamp timestamp = 3;
  double open = 4;
  double high = 5;
  double low = 6;
  double close = 7;
  int64 volume = 8;
  double vwap = 9;
  map<string, double> indicators = 10; // present-only: a series is absent during its warm-up
  bool warmup = 11;
  double signal_score = 12;
  double conviction = 13;
  BarAction action = 14;
  // Portfolio value (cash + position * close) after this bar — the per-bar equity
  // point the time-based equity curve plots (feature 068).
  double equity = 15;
}

// Per-symbol diagnostics bundle attached to a BacktestResult.
message SymbolDiagnostics {
  string symbol = 1;
  repeated BarDiagnostic bars = 2;
  NoTradeReason no_trade_reason = 3;
  int32 bars_total = 4;
  int32 warmup_bars = 5;
}

message ScoreStrategyRequest {
  string strategy_id = 1;
  xstockstrat.common.v1.TimeRange range = 2;
}

message StrategyScore {
  string strategy_id = 1;
  double overall_score = 2;
  map<string, double> component_scores = 3; // e.g. sharpe, drawdown, consistency
  string rating = 4; // A/B/C/D/F
  // Evidence provenance for the derived cross-stock headline grade (feature 065).
  int32 evidence_symbols = 5; // distinct symbols contributing eligible evidence cells
  int32 evidence_days = 6;    // total trading days of evidence across those symbols
  bool provisional = 7;       // true when evidence is below the symbol/day floor
}

message StrategyReport {
  string strategy_id = 1;
  BacktestResult latest_backtest = 2;
  StrategyScore score = 3;
  google.protobuf.Struct metadata = 4;
}

// ── Backtest run history ─────────────────────────────────────────────────────
// One summary row per completed RunBacktest, persisted so past runs survive a
// restart (the full trades/diagnostics live only on the latest in-memory result).

message ListBacktestsRequest {
  string strategy_id = 1;
  int32 limit = 2; // 0 → server default (most recent 20)
}

message BacktestRunSummary {
  string backtest_id = 1;
  string strategy_id = 2;
  BacktestStatus status = 3;
  double total_return = 4;
  double annualized_return = 5;
  double sharpe_ratio = 6;
  double max_drawdown = 7;
  double win_rate = 8;
  int32 total_trades = 9;
  double profit_factor = 10;
  repeated string symbols = 11;
  double overall_score = 12; // 0 when the run earned no score (e.g. INSUFFICIENT_DATA)
  string rating = 13;        // "" when the run earned no score
  google.protobuf.Timestamp completed_at = 14;
  // Backtest range covered by this run (feature 065); unset on legacy rows.
  google.protobuf.Timestamp range_start = 15;
  google.protobuf.Timestamp range_end = 16;
  SizingMode sizing_mode = 17; // capital-allocation model the run used (feature 150); UNSPECIFIED on pre-150 rows
  FillModel fill_model = 18;   // fill model the run used (feature 151); UNSPECIFIED on pre-151 rows
}

message ListBacktestsResponse {
  repeated BacktestRunSummary runs = 1;
}

message GetBacktestRequest { string backtest_id = 1; }

message ListStrategiesRequest {
  xstockstrat.common.v1.PageRequest page = 1;
  string user_id = 2;
}

message ListStrategiesResponse {
  repeated StrategyScore strategies = 1;
  xstockstrat.common.v1.PageResponse page = 2;
}

message GetStrategyReportRequest { string strategy_id = 1; }

// ── Composable strategy model (feature 047-strategy-engine) ──────────────────

enum ComponentKind {
  COMPONENT_KIND_UNSPECIFIED = 0;
  COMPONENT_KIND_BUILTIN_INDICATOR = 1;
  COMPONENT_KIND_CUSTOM_FORMULA = 2;
}

message StrategyComponent {
  string ref_name = 1;
  ComponentKind kind = 2;
  string indicator = 3;      // used when kind == COMPONENT_KIND_BUILTIN_INDICATOR
  string formula_id = 4;     // used when kind == COMPONENT_KIND_CUSTOM_FORMULA
  map<string, double> params = 5;
}

message StrategyDefinition {
  string strategy_id = 1;
  string display_name = 2;
  repeated StrategyComponent components = 3;
  string entry_rule = 4;   // JSON-encoded condition tree
  string exit_rule = 5;    // JSON-encoded condition tree
  google.protobuf.Struct signal_params = 6;
  bool active = 7;
  bool live_enabled = 8;
  // Per-symbol re-entry cooldown in calendar days (feature 069). optional = explicit presence:
  // unset → platform default (analysis.strategy.default_cooldown_days); explicit 0 → no cooldown
  // (immediate re-entry allowed); negative → rejected at write time (INVALID_ARGUMENT).
  optional int32 cooldown_days = 9;
  // Human-readable status warnings surfaced to the user on read (feature 086), e.g. a component
  // references a formula that has been soft-deleted — the strategy still evaluates (live and in
  // backtests) using the formula's last-saved definition, but the deletion is flagged. Populated
  // by GetStrategy; empty elsewhere.
  repeated string warnings = 10;
  // Per-strategy minimum holding period in calendar days before exit_rule may fire a sell
  // (feature 116 — exit cooldown; mirrors cooldown_days but gates the exit transition).
  // optional = explicit presence: unset → platform default
  // (analysis.strategy.default_exit_cooldown_days); explicit 0 → no minimum hold (exit
  // permitted immediately, current behavior); negative → rejected at write time
  // (INVALID_ARGUMENT).
  optional int32 exit_cooldown_days = 11;

  // Normalized-uppercase symbols this strategy must never evaluate FOR ENTRY (feature 132 —
  // entry-only deny). A held position on a denied symbol keeps exit tracing (the deny suppresses
  // only the entry edge, so an operator can always exit a position they already hold). Rides
  // definition_json (no column); maskable via ManageStrategyRequest.update_mask.
  repeated string denied_symbols = 12;

  // Owning user (feature 133). Server-authoritative: populated from the propagated
  // x-user-id header on ManageStrategy REGISTER, never accepted from the request body
  // (mirrors ListOpportunitiesRequest / portfolio ownership convention).
  string user_id = 13;

  // Gates whether the platform-wide active-signal term joins this strategy's evaluation universe
  // (feature 132). Plain bool (no optional) is intentional: absent ≡ false ≡ explicit-false resolve
  // identically. A strategy that sets BOTH a non-empty signal_params.symbols allowlist AND
  // signal_eligible=true is rejected INVALID_ARGUMENT at write time (the allowlist is already an
  // explicit universe override; signals would be redundant/contradictory). Rides definition_json;
  // maskable.
  bool signal_eligible = 14;
}

enum StrategyOperation {
  STRATEGY_OPERATION_UNSPECIFIED = 0;
  STRATEGY_OPERATION_REGISTER = 1;
  STRATEGY_OPERATION_UPDATE = 2;
  STRATEGY_OPERATION_DEACTIVATE = 3;
  STRATEGY_OPERATION_REACTIVATE = 4;  // set active=TRUE; re-validates the stored definition (feature 089)
}

message ManageStrategyRequest {
  StrategyOperation operation = 1;
  StrategyDefinition definition = 2;
  // Feature 070 — partial update. Applies to STRATEGY_OPERATION_UPDATE only; ignored for
  // REGISTER/DEACTIVATE.
  //
  //   present  → MERGE: only the listed top-level StrategyDefinition paths are taken from
  //              `definition`; every other stored field is preserved. A masked path whose value
  //              is absent from the request CLEARS that field (AIP-161 semantics) — that is the
  //              only way to express "erase this", since proto3 gives `components`/`entry_rule`/
  //              `exit_rule` no field presence.
  //   absent   → FULL REPLACE: byte-for-byte the pre-070 behavior, so existing clients (the
  //              StrategyWizard, which always sends a complete definition) are unaffected.
  //
  // Allowed paths: display_name, components, entry_rule, exit_rule, signal_params, cooldown_days,
  // exit_cooldown_days, denied_symbols, signal_eligible.
  // strategy_id/active/live_enabled are column-authoritative and rejected with INVALID_ARGUMENT.
  google.protobuf.FieldMask update_mask = 3;
}

message GetStrategyRequest {
  string strategy_id = 1;
}

message ListStrategyDefinitionsRequest {
  bool include_inactive = 1;
  int32 page_size = 2;
  int32 page_offset = 3;
}

message ListStrategyDefinitionsResponse {
  repeated StrategyDefinition definitions = 1;
  int32 total_count = 2;
}

// ── Live strategy→alert engine (feature 048-live-strategy-alert-engine) ──────

message SetStrategyLiveRequest {
  string strategy_id = 1;
  bool live_enabled = 2;
}

message SetStrategyLiveResponse {
  StrategyDefinition definition = 1;
}

// ── Screener engine (feature 060) ────────────────────────────────────────────

// Comparator for a screen criterion's threshold test (closed set → enum).
enum Comparator {
  COMPARATOR_UNSPECIFIED = 0;
  COMPARATOR_LT = 1;
  COMPARATOR_LTE = 2;
  COMPARATOR_GT = 3;
  COMPARATOR_GTE = 4;
  COMPARATOR_BETWEEN = 5;  // threshold <= x <= threshold_high
}

// What a screen criterion evaluates.
enum ScreenKind {
  SCREEN_KIND_UNSPECIFIED = 0;
  SCREEN_KIND_FUNDAMENTAL = 1;          // a fundamental metric (metric_name)
  SCREEN_KIND_TECHNICAL_FORMULA = 2;    // a custom formula (component)
  SCREEN_KIND_TECHNICAL_INDICATOR = 3;  // a built-in indicator (component)
  SCREEN_KIND_SIGNAL = 4;               // source-weighted signal blend
}

enum ScreenResultStatus {
  SCREEN_RESULT_STATUS_UNSPECIFIED = 0;
  SCREEN_RESULT_STATUS_OK = 1;
  SCREEN_RESULT_STATUS_INSUFFICIENT_DATA = 2;
}

message ScreenCriterion {
  string ref_name = 1;
  ScreenKind kind = 2;
  string metric_name = 3;          // FUNDAMENTAL only (e.g. "pe_ratio")
  StrategyComponent component = 4; // reused, for TECHNICAL_* kinds
  Comparator op = 5;
  double threshold = 6;
  double threshold_high = 7;       // for COMPARATOR_BETWEEN
  double weight = 8;               // contribution to the blended score
  bool hard_filter = 9;            // true → failing this excludes the symbol
}

message ScreenResult {
  string symbol = 1;
  double score = 2;
  map<string, double> criterion_scores = 3;  // per ref_name; skipped criteria are absent
  bool passed = 4;
  ScreenResultStatus status = 5;
  CoverageGap gap = 6;                        // populated when status == INSUFFICIENT_DATA
  // Raw column values surfaced on the screener results table (feature 083, FR-8).
  // rsi/atr come from the analysis→indicators edge; ATR is a close-only approximation
  // (indicators_engine.py) — surfaced as a known accuracy caveat, not exact.
  // rev_growth is best-effort from Fundamentals.extra_metrics (0 when FMP omits it).
  double pe = 7;
  double rsi = 8;
  double atr = 9;
  double rev_growth = 10;
  bool held = 11;
  // Per-criterion raw readings + pass/fail, for single-symbol screening where the universe-relative
  // `score`/`criterion_scores` collapse to a content-free 0.5 (feature 125, FR-8). Populated from the
  // same engine-internal values `criterion_scores` already draws from, exposed directly instead of
  // normalized.
  map<string, double> criterion_raw_values = 12;
  map<string, bool> criterion_passed = 13;
  // True when every criterion configured for this scan was skipped for this candidate (no
  // usable data for any of them, e.g. an ETF with no P/E ratio scanned against a `pe_ratio`
  // criterion) — `score`/`criterion_scores` still carry the same neutral-abstention values the
  // engine already used to keep the signal blend well-defined (`status` stays OK; this is the
  // soft-criterion sibling of the hard-filter null-as-zero fix, feature 144), but they are not a
  // real computed result and must not be treated as one (e.g. ranked/sorted as if genuine).
  bool score_unavailable = 14;
}

message ScreenSymbolsRequest {
  repeated string symbols = 1;
  repeated ScreenCriterion criteria = 2;
  // Blend params — same names the extracted scoring module reads (kept consistent with backtest).
  repeated string signal_sources = 3;
  double signal_weight = 4;
  double technical_weight = 5;
  double min_conviction = 6;
  int32 rank_limit = 7;
  // Reserved/optional — historical as-of is deferred (OQ-060-e); latest bar is the default.
  xstockstrat.common.v1.TimeRange evaluation_window = 8;
}

message ScreenSymbolsResponse {
  repeated ScreenResult results = 1;
  repeated CoverageGap coverage_gaps = 2;
}

// ── Fundamentals signal producer (feature 062) ───────────────────────────────

message RunFundamentalsScanRequest {
  bool force = 1;                  // ignore the day's idempotency guard / re-emit
  bool dry_run = 2;                // score + report but do not emit or spend cache calls
  repeated string symbols = 3;     // optional explicit override of the computed universe
}

message FundamentalsScanSummary {
  string run_id = 1;
  int32 symbols_processed = 2;
  int32 signals_emitted = 3;
  int32 calls_spent = 4;
  int32 deferred_count = 5;
  string status = 6;               // "completed" | "budget_deferred" | "failed"
  google.protobuf.Timestamp finished_at = 7;
}

// ── Opportunity queue + readiness + per-strategy analytics (feature 083) ──────

// The action a ranked opportunity suggests. Closed set → enum (C-04).
// TRIM/EXIT are deliberately collapsed into REDUCE — the platform must not
// synthesize a "fully exit vs trim" boundary on a row that opens a real order
// ticket; the human chooses trim vs exit at the ticket (design.md § 1).
enum OpportunityActionTag {
  OPPORTUNITY_ACTION_TAG_UNSPECIFIED = 0;
  OPPORTUNITY_ACTION_TAG_ENTER = 1;   // buy signal, not currently held
  OPPORTUNITY_ACTION_TAG_ADD = 2;     // buy signal, already held
  OPPORTUNITY_ACTION_TAG_REDUCE = 3;  // sell signal, held (trim or exit — human decides)
}

// Per-condition-leaf evaluation state. Closed set → enum (C-04).
enum ConditionState {
  CONDITION_STATE_UNSPECIFIED = 0;
  CONDITION_STATE_PASS = 1;  // leaf currently satisfied
  CONDITION_STATE_SOFT = 2;  // within the soft-band of the threshold but not passing
  CONDITION_STATE_FAIL = 3;  // not satisfied, outside the soft-band
}

// One ranked opportunity on the Decide queue. conviction is a deterministic
// ordinal (passing/total leaves + normalized worst-distance-to-threshold), NOT a
// probability — the UI renders "N/M conditions" + strength bars, never a fake %.
message Opportunity {
  string symbol = 1;
  OpportunityActionTag action = 2;
  double conviction = 3;
  int32 passing_conditions = 4;
  int32 total_conditions = 5;
  string thesis = 6;
  string strategy_id = 7;
  string source = 8;
  google.protobuf.Timestamp valid_until = 9;
  string opportunity_key = 10;      // server-authoritative opaque key = user|symbol_norm|strategy_id (feature 097). Client echoes it verbatim to SetOpportunityAction, never derives it.
  repeated string provenance = 11;  // contributing origins for a de-duplicated row (signal source(s) / "position" / "watchlist")
  bool muted = 12;                  // feature 132 — the (symbol, strategy) pair is on the strategy's deny list; surfaced as an explicit muted row (never conviction=0)
}

// One evaluated condition leaf from the traced evaluator (feature 083).
message ConditionEval {
  string ref_name = 1;
  double lhs_value = 2;
  double threshold = 3;
  string fn = 4;  // >, <, >=, <=, crosses_above, crosses_below
  ConditionState state = 5;
  double distance_to_threshold = 6;  // normalized
}

// Per-symbol readiness — the traced evaluation of a strategy's entry rule.
message SymbolReadiness {
  string symbol = 1;
  double conviction = 2;
  int32 passing_conditions = 3;
  int32 total_conditions = 4;
  repeated ConditionEval conditions = 5;
}

// Per-strategy analytics for the Engine → Strategies surface. expectancy and
// max_drawdown derive from persisted analysis.backtest_runs (win_rate +
// profit_factor); signals_30d from ingest QuerySignals; taken from trading
// ListOrders; queue_share from the opportunity-queue join.
message StrategyAnalytics {
  string strategy_id = 1;
  double expectancy = 2;
  double blended_hit_rate = 3;
  double max_drawdown = 4;
  int32 signals_30d = 5;
  int32 taken = 6;
  double queue_share = 7;
}

// user_id is intentionally absent — taken from the propagated x-user-id header
// server-side (matching the portfolio watchlist convention), never from the wire.
message ListOpportunitiesRequest {
  xstockstrat.common.v1.PageRequest page = 1;
  double min_conviction = 2;
}
message ListOpportunitiesResponse {
  repeated Opportunity opportunities = 1;
  xstockstrat.common.v1.PageResponse page = 2;
}

// Which rule tree EvaluateReadiness traces (feature 138). Closed set → enum (C-04).
enum ReadinessRule {
  READINESS_RULE_UNSPECIFIED = 0;  // server treats as ENTRY (back-compat default)
  READINESS_RULE_ENTRY = 1;        // trace the entry_rule (ENTER candidates, watchlist readiness)
  READINESS_RULE_EXIT = 2;         // trace the exit_rule (held REDUCE/ADD opportunities)
}

message EvaluateReadinessRequest {
  string strategy_id = 1;
  repeated string symbols = 2;
  // feature 138 — which rule tree to trace. UNSPECIFIED == ENTRY (back-compat). The Signal-detail
  // "Why this fired" panel requests EXIT for a held (REDUCE/ADD) opportunity so it explains the
  // exit rule that actually fired, reconciling with the queue's exit-derived conviction; every
  // other caller (watchlist readiness) leaves it unset and keeps entry-rule tracing.
  ReadinessRule rule = 3;
}
message EvaluateReadinessResponse {
  repeated SymbolReadiness readiness = 1;
}

// The persisted per-user disposition of a queued opportunity (feature 097). Closed set → enum (C-04).
enum OpportunityAction {
  OPPORTUNITY_ACTION_UNSPECIFIED = 0;
  OPPORTUNITY_ACTION_SNOOZE = 1;   // hide until snooze_until (bounded)
  OPPORTUNITY_ACTION_DISMISS = 2;  // hide indefinitely
  OPPORTUNITY_ACTION_TAKE = 3;     // user acted on it (feeds queue_share/taken reconciliation)
}

// user_id is intentionally absent — taken from the propagated x-user-id header server-side
// (match the ListOpportunitiesRequest convention), never from the wire.
message SetOpportunityActionRequest {
  string opportunity_key = 1;                  // the server-issued key, echoed verbatim
  OpportunityAction action = 2;
  google.protobuf.Timestamp snooze_until = 3;  // set only for SNOOZE; a bounded "snooze until"
}
message SetOpportunityActionResponse {}

message GetStrategyAnalyticsRequest {
  string strategy_id = 1;
}

message GetIndicatorSeriesRequest {
  string strategy_id = 1;
  string symbol = 2;
  // The caller's own already-fetched candlestick closes + their timestamps (the page passes the
  // exact bars it drew, so the x-axis is parity-aligned and no server re-fetch happens). closes
  // and times are index-aligned and equal length.
  repeated double closes = 3;
  repeated google.protobuf.Timestamp times = 4;
}

message GetIndicatorSeriesResponse {
  // Echoes the request times, index-aligned across every series in every component.
  repeated google.protobuf.Timestamp times = 1;
  repeated ComponentSeries components = 2;
}

message ComponentSeries {
  string ref_name = 1;
  ComponentKind kind = 2;
  repeated NamedSeries series = 3;
  // Non-empty when this component failed to compute (soft-deleted formula, sandbox timeout, NaN
  // output); series is then empty and the UI renders a per-panel error state. Per-component fault
  // isolation — one bad component never fails the whole RPC.
  string error = 4;
}

message NamedSeries {
  // "value" (primary) plus each secondary the component emits (bb.upper/bb.lower,
  // macd.signal/macd.histogram, stoch.d, or custom-formula output keys).
  string name = 1;
  // Index-aligned with the response times. Each point is an IndicatorValue whose `value` is UNSET
  // for a warm-up-head or mid-series None, so a gap never round-trips as a fabricated 0.0 (feature
  // 125, AC-4a/P-03). A bare `google.protobuf.DoubleValue` element cannot do this — in a repeated
  // field an empty DoubleValue is byte-identical to DoubleValue(0.0) and serializes to JSON `0`, so
  // the wrapper is a message with a proto3 `optional double` (explicit presence: HasField works and
  // JSON omits an unset value) instead.
  repeated IndicatorValue values = 2;
}

// One point of an indicator series. `value` unset == a gap (warm-up head / NaN / None), never 0.0.
message IndicatorValue {
  optional double value = 1;
}

// ── P&L pattern attribution (feature 042) ──────────────────────────────────────

// The order-lifecycle event a snapshot was captured at.
enum SnapshotEventType {
  SNAPSHOT_EVENT_TYPE_UNSPECIFIED = 0;
  SNAPSHOT_EVENT_TYPE_ORDER_CREATED = 1;
  SNAPSHOT_EVENT_TYPE_ORDER_FILLED = 2;
  SNAPSHOT_EVENT_TYPE_ORDER_PARTIALLY_FILLED = 3;
  SNAPSHOT_EVENT_TYPE_ORDER_CANCELLED = 4;
}

// Whether an attribution factor is an indicator value-range or a signal presence.
enum FactorType {
  FACTOR_TYPE_UNSPECIFIED = 0;
  FACTOR_TYPE_INDICATOR = 1;
  FACTOR_TYPE_SIGNAL = 2;
}

// One signal active for the symbol at snapshot time; `value` is the ingest conviction (0.0–1.0).
message SignalEntry {
  string name = 1;
  double value = 2;
  string source = 3;
}

// A point-in-time capture of the indicator/signal/market context at an order event.
message OrderSnapshot {
  string order_id = 1;
  string position_id = 2;
  string symbol = 3;
  SnapshotEventType event_type = 4;
  google.protobuf.Timestamp event_ts = 5;
  string side = 6;
  double quantity = 7;
  double price = 8;
  google.protobuf.Struct ohlcv_bar = 9;
  map<string, double> indicator_values = 10;
  repeated SignalEntry signals = 11;
}

// A ranked attribution factor: an indicator value-range or a signal, with its avg realized-P&L impact.
message PnLPatternFactor {
  string factor_name = 1;
  FactorType factor_type = 2;
  double value_range_low = 3;
  double value_range_high = 4;
  int32 sample_count = 5;
  double avg_pnl_impact = 6;
}

message QueryPnLPatternsRequest {
  string symbol = 1;
  string strategy_id = 2;
  google.protobuf.Timestamp from_ts = 3;
  google.protobuf.Timestamp to_ts = 4;
  int32 limit = 5;
}
message QueryPnLPatternsResponse {
  repeated PnLPatternFactor positive_factors = 1;
  repeated PnLPatternFactor negative_factors = 2;
}
