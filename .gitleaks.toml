title = "xstockstrat gitleaks config"

[extend]
useDefault = true

# False positive (feature 059): a descriptive comment in the FMP config seed migration
# (services/xstockstrat-config/migrations/007_marketdata_fmp.up.sql) historically read
# "first seeded secret: is_secret=TRUE", which trips the default generic-api-key heuristic.
# The seeded value is a `secret://` placeholder reference (config invariant #5 — secret
# values are never plaintext), not a real credential. Scoped to that exact line so any
# real secret is still detected.
#
# False positive (feature 147): the crypto unit tests hardcode a deterministic, patterned,
# obviously-fake 32-byte hex master key (`00112233...eeff`) to exercise the AES-256-GCM
# roundtrip and the boot-time key load. It is a test constant committed on purpose, not a real
# credential. Scoped to that exact literal so any real 32-byte hex secret is still detected.
# Sites: services/xstockstrat-config/src/__tests__/{crypto,secretsAndScope}.test.ts.
#
# False positive (feature 166): the mcp_client bearer-secret tests hardcode a deterministic,
# obviously-fake bearer literal (`sk-live-abc123`) to exercise the secret-first write path,
# the `Authorization: Bearer` header build, and the never-echoed redaction assertions. It is a
# test constant committed on purpose, not a real credential. Scoped to that exact literal so any
# real `sk-live-`-shaped key is still detected. Sites: services/xstockstrat-ingest/tests/
# {test_mcp_client,test_mcp_client_loop}.py, services/xstockstrat-agent/tests/test_tools.py,
# services/xstockstrat-ui/e2e/config-ui/sources.spec.ts.
#
# False positive (comment audit, 2026-09-04): the Finnhub client's response-shape comment names
# the public API field `marketCapitalization` — a 20-char alnum identifier that, sitting after the
# word "Finnhub" + a colon, trips the default `finnhub-access-token` rule. It is a documented JSON
# field name (also the struct json tag), not a credential. Scoped to that exact identifier so any
# real, random 20-char Finnhub token is still detected. Site:
# services/xstockstrat-marketdata/internal/finnhub/finnhub_client.go.
#
# False positive (feature 249): the IBKR OAuth signer tests need two fixed, committed RSA test
# keys so the ibind-generated PKCS#1 v1.5 / RSA-SHA256 reference vectors are reproducible. They
# were generated locally for testing only, are registered with no IBKR consumer, and authorize
# nothing. Scoped to a unique substring of each key's first body line so any other private key
# is still detected. Sites: services/xstockstrat-trading/internal/testdata/ibkr/
# {signature_key,encryption_key}.pem. The sibling vectors.json is generated test data (by
# gen_vectors.py from those keys) holding fake OAuth tokens, signatures and an encrypted test secret,
# with no real secrets, so it is allowlisted by that exact path; every other file is still scanned.
#
# False positive (feature 296): the migration-rerun assertion file's first revision (commit 6bf7029)
# named a both-secret test twin `happy6.secret` / `ledger.happy6.secret` in a key list, which the
# default generic-api-key heuristic read as a credential. It is a fixture key name (later renamed
# `happy6.sealed`), not a value. Scoped to that exact literal for the history scan.
#
# False positive (feature 338): the notify commsgun and SendGrid tests hardcode patterned, obviously-fake
# key literals (`k-0123456789abcdef…`, `<old|new|prod|stag>-key-0123456789abcdef…`, `SG.test-key-0123456789`)
# to assert that the key reaches only the Authorization header and never a log. Scoped to those exact
# literals. Sites: services/xstockstrat-notify/src/__tests__/{commsgun*,fanout,deliveryChannelsLog,sendgridSender}.test.ts.
[allowlist]
paths = [
  '''services/xstockstrat-trading/internal/testdata/ibkr/vectors\.json''',
]
regexTarget = "line"
regexes = [
  '''first seeded secret: is_secret=TRUE''',
  '''00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff''',
  '''sk-live-abc123''',
  '''marketCapitalization''',
  '''msc9FW9K\+LhMwlC2vKMbGIMcJOqLHLuIySZyDfw47JMiN9Bx''',
  '''5/Wx3MbGJ87zrySzogrw\+FuDmxa/3fnKqNqOEBp6dw0/J78o''',
  '''happy6\.secret''',
  '''k-0123456789abcdef0123456789abcdef''',
  '''(old|new|prod|stag)-key-0123456789abcdef0123456789''',
  '''SG\.test-key-0123456789''',
]
