version: "2"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - sloglint

  settings:
    sloglint:
      context: scope
      no-mixed-args: false

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/xstockstrat

run:
  timeout: 5m
