[project]
name = "xstockstrat-smoke"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "grpcio>=1.80.0",
  "protobuf>=6.31.1",
  "asyncpg>=0.29.0",
  "starlette>=0.46.0",
  "uvicorn==0.47.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "pytest-asyncio>=0.23.0", "httpx>=0.28.1", "jsonschema>=4.23.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "checks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
